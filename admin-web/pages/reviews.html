<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - Pagely Admin</title>
    <link rel="stylesheet" href="../css/styles.css?v=20261126a">
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { auth } from '../js/auth.js?v=4';
        import { api } from '../js/api.js?v=4';
        import { renderLayout, initLayout } from '../js/layout.js?v=4';
        import { renderToolbar, renderPagination } from '../js/components.js?v=4';
        import { createListStore, bindListToolbar } from '../js/list-utils.js?v=4';

        const PAGE_SIZE = 20;
        let store = null;

        const ICON_CHAT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>';
        const ICON_STAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></svg>';
        const ICON_EYE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.8 9.8 0 0112 6c5 0 8.5 4 9.5 6-.4.8-1.2 2-2.4 3.2M6.3 7.4C4.4 8.8 3.1 10.7 2.5 12 3.5 14 7 18 12 18c1.3 0 2.5-.3 3.6-.8"/></svg>';
        const ICON_HEART = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-8-4.7-8-10.6C4 6.9 6.2 5 8.6 5c1.5 0 2.7 .8 3.4 2 .7-1.2 1.9-2 3.4-2C17.8 5 20 6.9 20 9.9c0 5.9-8 10.6-8 10.6z"/></svg>';

        const ok = await auth.requireAdmin();
        if (ok) {
            document.getElementById('app').innerHTML = renderLayout(
                'Reviews',
                'See what readers are saying, which book each review is about, and remove anything that does not belong.',
                'COMMUNITY');
            initLayout();

            store = createListStore({
                search: '',
                filters: { status: '', rating: '' },
                sort: 'newest',
                page: 1,
                pageSize: PAGE_SIZE
            });

            store.subscribe(() => {
                load(1);
            });

            load(1);
        }

        function pick(o, k) {
            return o[k] ?? o[k[0].toUpperCase() + k.slice(1)];
        }

        async function load(page) {
            const content = document.getElementById('pageContent');
            content.innerHTML = `
                <div class="stat-row" id="stats"></div>
                <div class="filters" id="filters"></div>
                <div class="searchbar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 100 14 7 7 0 000-14z"/><path d="M16.5 16.5L21 21"/></svg>
                    <input type="search" id="reviewSearch" placeholder="Search by book, reader or review text…" autocomplete="off">
                </div>
                <div id="reviewList"></div>
                <div id="reviewPager"></div>
            `;

            const s = store.get();

            // Status pills (per-page filter config, kept as custom HTML)
            const statusPills = `
                <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;">
                    <button class="pill ${s.filters.status === '' ? 'active' : ''}" data-status="all">All</button>
                    <button class="pill ${s.filters.status === 'visible' ? 'active' : ''}" data-status="visible">Visible</button>
                    <button class="pill ${s.filters.status === 'hidden' ? 'active' : ''}" data-status="hidden">Hidden</button>
                    <button class="pill ${s.filters.status === 'deleted' ? 'active' : ''}" data-status="deleted">Removed</button>
                </div>
            `;

            const filtersEl = document.getElementById('filters');
            filtersEl.innerHTML = statusPills + renderToolbar({
                searchPlaceholder: 'Search by book, reader or review text…',
                searchValue: s.search,
                filters: [
                    {
                        key: 'rating',
                        options: [
                            { value: '', label: 'All ratings' },
                            { value: '5', label: '5 stars' },
                            { value: '4', label: '4 stars' },
                            { value: '3', label: '3 stars' },
                            { value: '2', label: '2 stars' },
                            { value: '1', label: '1 star' }
                        ],
                        value: s.filters.rating || ''
                    }
                ],
                sortOptions: [
                    { value: 'newest', label: 'Newest' },
                    { value: 'oldest', label: 'Oldest' },
                    { value: 'highest', label: 'Highest rating' },
                    { value: 'lowest', label: 'Lowest rating' },
                    { value: 'mostliked', label: 'Most liked' },
                    { value: 'book', label: 'Book A-Z' },
                    { value: 'reader', label: 'Reader A-Z' }
                ],
                sortValue: s.sort
            });

            // Wire status pill clicks
            filtersEl.querySelectorAll('[data-status]').forEach(b => {
                b.addEventListener('click', () => {
                    store.setFilter('status', b.dataset.status === 'all' ? '' : b.dataset.status);
                });
            });

            // Bind shared toolbar events
            bindListToolbar('#filters', store, {
                onSearch: (v) => store.setSearch(v),
                onFilter: (key, v) => store.setFilter(key, v),
                onSort: (v) => store.setSort(v),
                onReset: () => store.reset(),
                onPrev: () => store.setPage(store.get().page - 1),
                onNext: () => store.setPage(store.get().page + 1)
            });

            try {
                const params = store.toParams();
                const data = await api.get(`/api/admin/reviews?${params.toString()}`);
                const reviews = (Array.isArray(data.items) ? data.items : (data.Items || [])).map(normalize);
                const totalCount = data.totalCount ?? data.TotalCount ?? 0;
                const totalPages = data.totalPages ?? data.TotalPages ?? 1;
                const pageNum = data.page || data.Page || 1;

                renderStats(reviews, totalCount);
                renderReviews(reviews, totalCount, pageNum);
                renderPager(pageNum, totalPages);
            } catch (error) {
                document.getElementById('reviewList').innerHTML =
                    `<div class="alert alert-error">Could not load reviews: ${escapeHtml(error.message || 'Unknown error')}</div>`;
            }
        }

        function normalize(r) {
            return {
                id: pick(r, 'id'),
                bookId: pick(r, 'bookId'),
                bookTitle: pick(r, 'bookTitle') || 'Untitled book',
                bookAuthor: pick(r, 'bookAuthor') || '',
                bookCover: pick(r, 'bookCoverImageUrl') || '',
                user: pick(r, 'userEmail') || 'Unknown reader',
                rating: Number(pick(r, 'rating')) || 0,
                text: pick(r, 'reviewText') || '',
                likes: pick(r, 'likeCount') ?? 0,
                hidden: !!pick(r, 'isHidden'),
                deleted: !!pick(r, 'isDeleted'),
                created: pick(r, 'createdAt')
            };
        }

        function renderStats(reviews, totalCount) {
            const avg = reviews.length ? (reviews.reduce((a, r) => a + r.rating, 0) / reviews.length) : 0;
            const flagged = reviews.filter(r => r.hidden || r.deleted).length;
            document.getElementById('stats').innerHTML = `
                <div class="mini-stat"><div class="icon-tile">${ICON_CHAT}</div><div><strong>${totalCount}</strong><span>Total reviews</span></div></div>
                <div class="mini-stat"><div class="icon-tile">${ICON_STAR}</div><div><strong>${reviews.length ? avg.toFixed(1) : '–'}</strong><span>Average rating</span></div></div>
                <div class="mini-stat"><div class="icon-tile">${ICON_EYE}</div><div><strong>${flagged}</strong><span>Hidden or removed</span></div></div>`;
        }

        function renderReviews(reviews, totalCount, pageNum) {
            const s = store.get();
            const q = s.search;
            const statusOf = (r) => r.deleted ? 'deleted' : r.hidden ? 'hidden' : 'visible';

            const list = reviews.filter(r =>
                (s.filters.status === '' || statusOf(r) === s.filters.status) &&
                (s.filters.rating === '' || r.rating === Number(s.filters.rating)) &&
                (!q || (r.bookTitle + ' ' + r.bookAuthor + ' ' + r.user + ' ' + r.text).toLowerCase().includes(q))
            );

            const el = document.getElementById('reviewList');
            if (!reviews.length) {
                el.innerHTML = '<div class="empty-state card"><strong>No reviews yet</strong>Reviews written by readers will show up here.</div>';
            } else if (!list.length) {
                el.innerHTML = '<div class="empty-state card"><strong>No reviews match these filters</strong>Try a different status, rating or search.</div>';
            } else {
                el.innerHTML = `<div class="toolbar"><span class="result-count">Showing ${list.length} of ${reviews.length} on this page</span></div>
                    <div class="review-list">${list.map(cardHtml).join('')}</div>`;
            }

            const pager = document.getElementById('reviewPager');
            const totalPages = Math.ceil(totalCount / s.pageSize) || 1;
            pager.innerHTML = totalPages > 1 ? `
                <div class="pagination">
                    <button ${pageNum <= 1 ? 'disabled' : ''} data-action="page" data-page="${pageNum - 1}">Prev</button>
                    <span>Page ${pageNum} of ${totalPages}</span>
                    <button ${pageNum >= totalPages ? 'disabled' : ''} data-action="page" data-page="${pageNum + 1}">Next</button>
                </div>` : '';

            // Wire page buttons
            pager.querySelectorAll('[data-action="page"]').forEach(b => {
                b.addEventListener('click', () => {
                    store.setPage(parseInt(b.dataset.page, 10));
                });
            });
        }

        function renderPager(pageNum, totalPages) {
            // Already handled in renderReviews
        }

        function cardHtml(r) {
            const st = r.deleted ? 'deleted' : r.hidden ? 'hidden' : 'visible';
            const initial = escapeHtml((r.bookTitle || '?').trim().charAt(0).toUpperCase());
            const cover = /^https?:\/\//i.test(r.bookCover)
                ? `<img src="${escapeHtml(r.bookCover)}" alt="" loading="lazy" onerror="this.remove="">` : '';
            const badge = st === 'visible' ? '<span class="badge badge-success">Visible</span>'
                : st === 'hidden' ? '<span class="badge badge-warning">Hidden</span>'
                : '<span class="badge badge-danger">Removed</span>';
            const who = r.user.split('@')[0] || r.user;
            return `
                <article class="review-card is-${st}">
                    <div class="cover"><span aria-hidden="true">${initial}</span>${cover}</div>
                    <div class="review-main">
                        <div class="review-head">
                            <div class="review-book">
                                <h3>${escapeHtml(r.bookTitle)}</h3>
                                <div class="author">${r.bookAuthor ? 'by ' + escapeHtml(r.bookAuthor) : '&nbsp;'}</div>
                            </div>
                            <div style="display:flex;align-items:center;gap:.75rem">${starsHtml(r.rating)}${badge}</div>
                        </div>
                        ${r.text
                            ? `<div class="review-text">${escapeHtml(r.text)}</div>`
                            : '<div class="review-text empty">Rated without a written review.</div>'}
                        <div class="review-foot">
                            <div class="reviewer">
                                <div class="avatar" aria-hidden="true">${escapeHtml(who.charAt(0).toUpperCase())}</div>
                                <div style="min-width:0">
                                    <div class="who" title="${escapeHtml(r.user)}">${escapeHtml(r.user)}</div>
                                    <div class="when">${escapeHtml(timeAgo(r.created))}</div>
                                </div>
                            </div>
                            <div class="right">
                                <span class="likes" title="Likes">${ICON_HEART} ${r.likes}</span>
                                ${st === 'deleted' ? '' : `<button class="btn btn-sm btn-ghost" style="color:var(--danger)" data-action="remove" data-id="${escapeHtml(r.id)}" data-book="${escapeHtml(r.bookTitle)}">Remove</button>`}
                            </div>
                        </div>
                    </div>
                </article>`;
        }

        function starsHtml(n) {
            let s = '';
            for (let i = 1; i <= 5; i++) {
                s += `<svg class="${i <= n ? '' : 'off'}" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9 .8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></svg>`;
            }
            return `<span class="stars" role="img" aria-label="${n} out of 5">${s}<b>${n}.0</b></span>`;
        }

        function timeAgo(iso) {
            const d = new Date(iso);
            if (isNaN(d)) return '';
            const days = Math.floor((Date.now() - d.getTime()) / 86400000);
            if (days <= 0) return 'Today';
            if (days === 1) return 'Yesterday';
            if (days < 30) return `${days} days ago`;
            return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        // ---- actions ---------------------------------------------------------
        document.getElementById('pageContent').addEventListener('click', (e) => {
            const el = e.target.closest('[data-action]');
            if (!el) return;
            if (el.dataset.action === 'remove') removeReview(el.dataset.id, el.dataset.book);
        });

        async function removeReview(id, book) {
            if (!confirm(`Remove this review of "${book}"? Readers will no longer see it.`)) return;
            try {
                await api.delete(`/api/admin/reviews/${id}`);
                load(store.get().page);
            } catch (error) {
                alert('Could not remove review: ' + error.message);
            }
        }
    </script>
</body>
</html>
