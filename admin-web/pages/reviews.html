<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - Book Community Admin</title>
    <link rel="stylesheet" href="../css/styles.css?v=20261029b">
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { auth } from '../js/auth.js';
        import { api } from '../js/api.js';
        import { renderLayout, initLayout } from '../js/layout.js';

        let currentPage = 1;

        const ok = await auth.requireAdmin();
        if (!ok) {
        } else {
            document.getElementById('app').innerHTML = renderLayout('Reviews', 'Browse all user reviews and their moderation status.');
            initLayout();
            loadReviews(1);
        }

        async function loadReviews(page = 1) {
            currentPage = page;
            const content = document.getElementById('pageContent');
            content.innerHTML = '<div class="loading">Loading reviews...</div>';

            try {
                const data = await api.get(`/api/admin/reviews?page=${page}&pageSize=20`);
                const reviews = Array.isArray(data.items) ? data.items : [];
                const totalCount = data.totalCount || 0;
                const totalPages = data.totalPages || 1;

                let html = `
                    <div class="card">
                        <div class="card-header">
                            <h2>Reviews (${totalCount})</h2>
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Book</th>
                                        <th>User</th>
                                        <th>Rating</th>
                                        <th>Review</th>
                                        <th>Status</th>
                                        <th>Likes</th>
                                        <th>Created</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                if (reviews.length === 0) {
                    html += '<tr><td colspan="7" class="empty-state">No reviews found</td></tr>';
                } else {
                    for (const review of reviews) {
                        const status = (review.isDeleted || review.IsDeleted) ? 'Deleted' :
                            (review.isHidden || review.IsHidden) ? 'Hidden' : 'Visible';
                        const text = review.reviewText || review.ReviewText || '';
                        html += `
                            <tr>
                                <td>${escapeHtml(review.bookTitle || review.BookTitle || '')}</td>
                                <td>${escapeHtml(review.userEmail || review.UserEmail || '')}</td>
                                <td>${review.rating || review.Rating}/5</td>
                                <td>${escapeHtml(text.length > 100 ? text.substring(0, 100) + '...' : text)}</td>
                                <td>${status}</td>
                                <td>${review.likeCount ?? review.LikeCount ?? 0}</td>
                                <td>${new Date(review.createdAt || review.CreatedAt).toLocaleDateString()}</td>
                            </tr>
                        `;
                    }
                }

                html += `
                                </tbody>
                            </table>
                        </div>
                        <div class="pagination">
                            <button ${page <= 1 ? 'disabled' : ''} data-action="prevReviewPage" data-page="${page - 1}">Previous</button>
                            <span>Page ${page} of ${totalPages}</span>
                            <button ${page >= totalPages ? 'disabled' : ''} data-action="nextReviewPage" data-page="${page + 1}">Next</button>
                        </div>
                    </div>
                `;

                content.innerHTML = html;

                content.querySelectorAll('[data-action="prevReviewPage"]').forEach(b => {
                    b.addEventListener('click', () => loadReviews(parseInt(b.dataset.page)));
                });
                content.querySelectorAll('[data-action="nextReviewPage"]').forEach(b => {
                    b.addEventListener('click', () => loadReviews(parseInt(b.dataset.page)));
                });
            } catch (error) {
                content.innerHTML = `<div class="alert alert-error">Error loading reviews: ${escapeHtml(error.message || 'Unknown error')}</div>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
