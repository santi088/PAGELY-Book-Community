<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pagely Admin</title>
    <link rel="stylesheet" href="../css/styles.css?v=20261127c">
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { auth } from '../js/auth.js?v=9';
        import { api } from '../js/api.js?v=9';
        import { renderLayout, initLayout, updateSidebarUserInfo } from '../js/layout.js?v=9';

        let dashboard = null;
        let selYear = new Date().getFullYear();
        let selMonth = new Date().getMonth() + 1;
        let lastUpdated = null;
        let earliestYear = new Date().getFullYear();

        // Pluralization helper used everywhere
        function pluralize(count, singular, plural = null) {
            const p = plural || singular + 's';
            return count === 1 ? `1 ${singular}` : `${count} ${p}`;
        }

        const isAdmin = await auth.requireAdmin();
        if (!isAdmin) {
        } else {
            document.getElementById('app').innerHTML = renderLayout(
                'Dashboard',
                'Overview of catalog and administration activity.',
                'DASHBOARD');
            initLayout();

            if (!window.__dashboardEscapeBound) {
                window.__dashboardEscapeBound = true;
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        const modal = document.getElementById('detailModal');
                        if (modal) modal.classList.remove('active');
                    }
                });
            }

            loadDashboard();
        }

        async function loadDashboard() {
            const content = document.getElementById('pageContent');
            content.innerHTML = `
                <div class="loading">Loading dashboard...</div>
            `;

            try {
                const [dash, trends] = await Promise.all([
                    api.get(`/api/admin/dashboard?days=7`),
                    api.get(`/api/admin/dashboard/trends?year=${selYear}&month=${selMonth}`)
                ]);
                dashboard = { ...dash, ...trends };
                lastUpdated = new Date();
                earliestYear = dashboard.earliestYear || selYear;

                content.innerHTML = renderDashboard(dashboard);
                wireDashboardEvents();
            } catch (error) {
                if (error.status === 401 || error.status === 403) {
                    content.innerHTML = `<div class="alert alert-error">Authorization failed. Admin privileges required.</div>`;
                } else {
                    content.innerHTML = `<div class="alert alert-error">Error loading dashboard: ${escapeHtml(error.message)}</div>`;
                }
            }
        }

        function renderDashboard(d) {
            const pendingWarning = d.oldestPendingReportDays > 3 ? ' stat-card--warn' : '';

            // Period comparison strings
            const pendingCompare = d.previousPendingReports > 0
                ? `${d.pendingReports >= d.previousPendingReports ? '+' : ''}${d.pendingReports - d.previousPendingReports} vs previous ${d.days || 7} days`
                : d.pendingReports === d.previousPendingReports ? 'no change' : '';
            const newReportsCompare = d.previousPeriodNewReports > 0
                ? `${d.newReportsLast7Days >= d.previousPeriodNewReports ? '+' : ''}${d.newReportsLast7Days - d.previousPeriodNewReports} vs previous ${d.days || 7} days`
                : d.newReportsLast7Days === d.previousPeriodNewReports ? 'no change' : '';
            const hiddenCompare = d.previousPeriodHiddenRemovedReviews > 0
                ? `${d.hiddenRemovedReviewsLast7Days >= d.previousPeriodHiddenRemovedReviews ? '+' : ''}${d.hiddenRemovedReviewsLast7Days - d.previousPeriodHiddenRemovedReviews} vs previous ${d.days || 7} days`
                : d.hiddenRemovedReviewsLast7Days === d.previousPeriodHiddenRemovedReviews ? 'no change' : '';

            return `
                <div class="section">
                    <!-- A. Needs Attention -->
                    <div class="card-depth">
                        <div class="card-header">
                            <h2>Needs Attention</h2>
                            <p class="section-description">Pending reports: moderate today?</p>
                        </div>
                        <div class="grid">
                            <div class="stat-card${pendingWarning}" data-nav="reports.html?status=pending" style="cursor:pointer;">
                                <h3>${d.pendingReports}</h3>
                                <p>
                                    ${d.pendingReports === 0 ? 'All caught up' : `Pending reports &bull; oldest ${d.oldestPendingReportDays}d ago`}
                                    ${pendingCompare ? `<br><span class="compare-text">${pendingCompare}</span>` : ''}
                                </p>
                                ${d.oldestPendingReportDays > 3 ? '<span class="badge badge-warning">Over 3 days old</span>' : ''}
                            </div>
                            <div class="stat-card card-depth" data-nav="reports.html?sort=newest" style="cursor:pointer;">
                                <h3>${d.newReportsLast7Days}</h3>
                                <p>New reports (7 days)${newReportsCompare ? `<br><span class="compare-text">${newReportsCompare}</span>` : ''}</p>
                            </div>
                            <div class="stat-card card-depth" data-nav="reviews.html?status=hidden" style="cursor:pointer;">
                                <h3>${d.hiddenRemovedReviewsLast7Days}</h3>
                                <p>Hidden/removed reviews (7 days)${hiddenCompare ? `<br><span class="compare-text">${hiddenCompare}</span>` : ''}</p>
                            </div>
                        </div>
                    </div>

                    <!-- E. Context strip -->
                    <div class="card-depth">
                        <div class="card-header">
                            <h2>Catalog at a glance</h2>
                            <p class="section-description">Visible vs hidden, user health, review volume.</p>
                        </div>
                        <div class="grid">
                            <div class="stat-card card-depth">
                                <h3>${d.visibleBooks}</h3>
                                <p>Visible books${d.hiddenBooks > 0 ? ` &bull; ${d.hiddenBooks} hidden` : ''}</p>
                            </div>
                            <div class="stat-card card-depth">
                                <h3>${d.totalGenres}</h3>
                                <p>Genres</p>
                            </div>
                            <div class="stat-card card-depth">
                                <h3>${d.activeUsers}</h3>
                                <p>Active users${d.suspendedUsers > 0 ? ` &bull; ${d.suspendedUsers} suspended` : ''}</p>
                            </div>
                            <div class="stat-card card-depth">
                                <h3>${d.visibleReviews}</h3>
                                <p>Visible reviews</p>
                            </div>
                        </div>
                    </div>

                    <!-- B. Trends -->
                        <div class="card-depth">
                            <div class="card-header">
                                <h2 id="trendsTitle">Trends</h2>
                                <p class="section-description">New users and reviews per week, report reasons, resolution breakdown.</p>
                            </div>

                        <!-- Row 1: Chart (full width) -->
                        <div class="stat-card card-depth" style="margin-top:var(--space-4); padding-bottom:var(--space-4);">
                            <div class="chart-card" id="trendChartCard">
                                <div class="chart-wrapper" id="chartWrapper" style="display:flex;gap:var(--space-2);align-items:flex-start;">
                                    <div style="flex:1;">
                                        ${renderTrendChart(d.weeks, selYear, selMonth)}
                                    </div>
                                    <div style="width:270px;display:flex;flex-direction:column;gap:var(--space-3);padding-top:var(--space-1);padding-left:var(--space-2);">
                                        <div style="padding-top:var(--space-1);">
                                            <label for="trendYear" style="font-size:var(--font-size-sm);color:var(--color-text-muted);display:block;margin-bottom:var(--space-1);">Year</label>
                                            <select id="trendYear" class="form-control" style="width:100%;margin-bottom:var(--space-2);"></select>
                                            <label for="trendMonth" style="font-size:var(--font-size-sm);color:var(--color-text-muted);display:block;margin-bottom:var(--space-1);">Month</label>
                                            <select id="trendMonth" class="form-control" style="width:100%;"></select>
                                        </div>
                                        <div class="chart-legend">
                                            <div class="legend-item"><span class="legend-color" style="background:#4A2411"></span> Users</div>
                                            <span class="legend-separator">•</span>
                                            <div class="legend-item"><span class="legend-color" style="background:#C79A5B"></span> Reviews</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Row 2: Two equal-width cards side by side -->
                        <div class="grid" style="grid-template-columns:repeat(2,1fr);gap:var(--space-4);">
                            <!-- Reports by reason -->
                            <div class="stat-card card-depth">
                                <h3 style="font-size: var(--font-size-lg);">Reports by reason</h3>
                                <div class="reason-list" id="reasonList">${renderReasonList(d.reportsByReason)}</div>
                                ${d.reportsByReason.length === 0 ? '<div class="empty-state" style="padding: var(--space-2);">No reports</div>' : ''}
                            </div>

                            <!-- Report resolution with percentages -->
                            <div class="stat-card card-depth">
                                <h3 style="font-size: var(--font-size-lg);">Report resolution</h3>
                                <div class="breakdown-list" id="breakdownList">${renderBreakdown(d.statusBreakdown)}</div>
                                ${d.statusBreakdown && d.statusBreakdown.Total === 0 ? '<div class="empty-state" style="padding: var(--space-2);">No reports</div>' : ''}
                            </div>
                        </div>
                    </div>

                    <!-- C. Catalog insights -->
                    <div class="card-depth">
                        <div class="card-header">
                            <h2>Catalog insights</h2>
                            <p class="section-description">Books per genre, top rated/reviewed, most saved, missing cover data.</p>
                        </div>

                        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start;">
                            <!-- Books per genre bar chart -->
                            <div class="stat-card">
                                <h3 style="font-size: var(--font-size-lg);">Books per genre</h3>
                                <div class="bar-chart" id="barChartBooksPerGenre">${renderBarChart(d.booksPerGenre)}</div>
                                ${d.booksPerGenre.length === 0 ? '<div class="empty-state" style="padding: var(--space-2);">No genre data</div>' : ''}
                                <div class="zero-genre-list" id="zeroGenreList">${renderZeroGenres(d.genresWithZeroVisibleBooks)}</div>
                            </div>

                            <!-- Top 5 most reviewed -->
                            <div class="stat-card">
                                <h3 style="font-size: var(--font-size-lg);">Top 5 most reviewed</h3>
                                <div class="top-list" id="topReviewed">${renderTopList(d.top5MostReviewed, 'reviews')}</div>
                                ${d.top5MostReviewed.length === 0 ? '<div class="empty-state" style="padding: var(--space-2);">No reviewed books</div>' : ''}
                            </div>

                            <!-- Top 5 highest rated -->
                            <div class="stat-card">
                                <h3 style="font-size: var(--font-size-lg);">Top 5 highest rated</h3>
                                <div class="top-list" id="topRated">${renderTopRatedList(d.top5HighestRated)}</div>
                                ${d.top5HighestRated.length === 0 ? `<div class="empty-state" style="padding: var(--space-2);">Not enough data yet (need ${d.minReviewsForHighestRated ?? 3}+ visible reviews)</div>` : ''}
                            </div>

                            <!-- Top 5 most saved -->
                            <div class="stat-card">
                                <h3 style="font-size: var(--font-size-lg);">Top 5 most saved</h3>
                                <div class="top-list" id="topSaved">${renderTopList(d.top5MostSaved, 'saves')}</div>
                                ${d.top5MostSaved.length === 0 ? '<div class="empty-state" style="padding: var(--space-2);">No reading list entries</div>' : ''}
                            </div>

                            <!-- Missing cover/description -->
                            <div class="stat-card">
                                <h3 style="font-size: var(--font-size-lg);">Missing cover or description</h3>
                                <div class="stat-card-inner">
                                    <h3 style="font-size: 2rem; margin: 0;">${d.booksMissingCoverOrDescription}</h3>
                                    <p>visible books affected</p>
                                </div>
                                <div class="missing-list" id="missingList">${renderMissingList(d.booksMissingCoverOrDescriptionSample)}</div>
                                ${d.booksMissingCoverOrDescriptionSample.length === 0 ? '<div class="empty-state" style="padding: var(--space-2);">All books have cover and description</div>' : ''}
                                <div style="margin-top:var(--space-2);">
                                    <a href="books.html?filter=missingCoverOrDesc" class="btn btn-sm btn-secondary">View all</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- D. Moderation insights -->
                    <div class="card-depth">
                        <div class="card-header">
                            <h2>Moderation insights</h2>
                            <p class="section-description">Most reported books and reviewers.</p>
                        </div>
                        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start;">
                            <div class="stat-card">
                                <h3 style="font-size: var(--font-size-lg);">Top 5 most reported books</h3>
                                <div class="top-list" id="topReportedBooks">${renderReportedList(d.top5MostReportedBooks, 'reports')}</div>
                                ${d.top5MostReportedBooks.length === 0 ? `<div class="empty-state" style="padding: var(--space-2);">Not enough data yet (need ${d.minReportsForMostReportedBooks ?? 2}+ reports)</div>` : ''}
                            </div>
                            <div class="stat-card">
                                <h3 style="font-size: var(--font-size-lg);">Top 5 most reported reviewers</h3>
                                <div class="top-list" id="topReportedReviewers">${renderReportedList(d.top5MostReportedReviewers, 'reports')}</div>
                                ${d.top5MostReportedReviewers.length === 0 ? `<div class="empty-state" style="padding: var(--space-2);">Not enough data yet (need ${d.minReportsForMostReportedReviewers ?? 2}+ reports)</div>` : ''}
                            </div>
                        </div>
                    </div>

                    <!-- Refresh bar -->
                    <div class="card-depth" style="padding:var(--space-4);">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;">
                            <span class="update-label" id="updateLabel">Updated ${formatTime(lastUpdated)}</span>
                            <button class="btn btn-primary btn-sm" id="btnRefresh" type="button">Refresh</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ---------- render helpers ----------

        function formatTime(dt) {
            if (!dt) return 'never';
            return dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        function renderSparkline(items, totalDays) {
            if (!items || items.length === 0) return '';
            const max = Math.max(...items.map(i => i.count), 1);
            const bars = items.map((i, idx) => {
                const h = Math.round((i.count / max) * 60);
                const label = shortDateLabel(i.date, totalDays);
                return `
                    <div class="spark-bar" style="height:${h}px;" title="${i.date}: ${i.count}">${i.count > 0 ? i.count : ''}</div>
                    ${label ? `<div class="spark-label">${label}</div>` : '<div class="spark-label-spacer"></div>'}
                `;
            }).join('');
            return `
                <div class="sparkline-wrap">
                    ${bars}
                </div>
            `;
        }

        function shortDateLabel(isoDate, totalDays) {
            const d = new Date(isoDate + 'T00:00:00');
            const month = d.toLocaleDateString(undefined, { month: 'short' });
            const day = d.getDate();
            const showDay = totalDays === 7 || (d.getDate() % 5 === 1 || d.getDate() === 1);
            return showDay ? `${month} ${day}` : '';
        }

        function renderReasonList(items) {
            if (!items || items.length === 0) return '';
            return items.map(r => `
                <div class="reason-item">
                    <span class="reason-name">${escapeHtml(r.reason)}</span>
                    <span class="reason-count">${r.count}</span>
                    <div class="reason-bar"><div class="reason-bar-fill" style="width:${r.count * 20}%"></div></div>
                </div>
            `).join('');
        }

        function renderBreakdown(b) {
            if (!b || b.Total === 0) return '';
            return `
                <div class="breakdown-item"><span>Pending</span><span>${b.pending} (${b.PendingPercent}%)</span></div>
                <div class="breakdown-item"><span>Dismissed</span><span>${b.dismissed} (${b.DismissedPercent}%)</span></div>
                <div class="breakdown-item"><span>Resolved</span><span>${b.resolved} (${b.ResolvedPercent}%)</span></div>
            `;
        }

        function renderBarChart(items) {
            if (!items || items.length === 0) return '';
            // Scale bars to top 8 only; "Other" row has no bar
            const top8 = items.slice(0, 8);
            const max = Math.max(...top8.map(i => i.bookCount), 1);
            return items.map((i, idx) => {
                const isOther = idx >= 8 || i.genreName.startsWith('Other');
                const pct = isOther ? 0 : Math.round((i.bookCount / max) * 100);
                return `
                    <div class="bar-item">
                        <span class="bar-label${isOther ? ' other-genre' : ''}" title="${escapeHtml(i.genreName)}">${escapeHtml(i.genreName)}</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
                        <span class="bar-value">${i.bookCount}</span>
                    </div>
                `;
            }).join('');
        }

        function renderZeroGenres(items) {
            if (!items || items.length === 0) return '';
            return `
                <div class="zero-genres">
                    <p style="font-size: var(--font-size-xs); color: var(--color-text-muted); margin-bottom: var(--space-1);">Genres with zero visible books:</p>
                    ${items.map(g => `<a href="books.html?genre=${encodeURIComponent(g)}" class="chip chip-link">${escapeHtml(g)}</a>`).join('')}
                </div>
            `;
        }

        function renderTopList(items, unitLabel) {
            if (!items || items.length === 0) return '';
            return items.map((b, idx) => `
                <div class="top-item">
                    <span class="top-rank">${idx + 1}</span>
                    <span class="top-title" title="${escapeHtml(b.title)}">${escapeHtml(b.title)}</span>
                    <span class="top-count">${pluralize(b.count, unitLabel)}</span>
                </div>
            `).join('');
        }

        function renderTopRatedList(items) {
            if (!items || items.length === 0) return '';
            return items.map((b, idx) => `
                <div class="top-item">
                    <span class="top-rank">${idx + 1}</span>
                    <span class="top-title" title="${escapeHtml(b.title)}">${escapeHtml(b.title)}</span>
                    <span class="top-count">★ ${b.averageRating?.toFixed(1) ?? '–'} (${pluralize(b.reviewCount, 'review')})</span>
                </div>
            `).join('');
        }

        function renderReportedList(items, unitLabel) {
            if (!items || items.length === 0) return '';
            return items.map((b, idx) => `
                <div class="top-item">
                    <span class="top-rank">${idx + 1}</span>
                    <span class="top-title" title="${escapeHtml(b.name)}">${escapeHtml(b.name)}</span>
                    <span class="top-count">${pluralize(b.reportCount, unitLabel)}</span>
                </div>
            `).join('');
        }

        function renderMissingList(items) {
            if (!items || items.length === 0) return '';
            return items.map(b => {
                const chips = [];
                if (!b.coverImageUrl) chips.push('No cover');
                if (!b.description) chips.push('No description');
                return `
                <div class="missing-item">
                    <a href="books.html" class="missing-title">${escapeHtml(b.title)}</a>
                    <span class="missing-chips">${chips.map(c => `<span class="chip">${escapeHtml(c)}</span>`).join('')}</span>
                </div>
            `;
            }).join('');
        }

        function renderTrendChart(weeks, year, month) {
            if (!weeks || weeks.length === 0) return '';
            const monthName = new Date(year, month - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
            const allZero = weeks.every(w => w.newUsers === 0 && w.newReviews === 0);
            const maxVal = Math.max(...weeks.map(w => Math.max(w.newUsers, w.newReviews)), 1);
            const barH = 170;
            const gap = 45;
            const barW = 44;

            // Build SVG
            const svgW = Math.max(500, weeks.length * (barW + gap) + 100);
            const svgH = 240;

            let barsHtml = '';
            let labelsHtml = '';
            let hiddenTable = '<table><thead><tr><th>Week</th><th>New Users</th><th>New Reviews</th></tr></thead><tbody>';

            const baseY = svgH - 50;

            weeks.forEach((w, i) => {
                const x = 60 + i * (barW + gap);
                const uH = w.newUsers === 0 ? 0 : Math.round((w.newUsers / maxVal) * barH);
                const rH = w.newReviews === 0 ? 0 : Math.round((w.newReviews / maxVal) * barH);

                // Users bar (left)
                if (uH > 0) {
                    barsHtml += `<rect x="${x}" y="${baseY - uH}" width="${barW / 2 - 4}" height="${uH}" fill="#4A2411" title="Week ${i + 1}: ${w.newUsers} new users"/>`;
                }
                // Reviews bar (right)
                if (rH > 0) {
                    barsHtml += `<rect x="${x + barW / 2 + 4}" y="${baseY - rH}" width="${barW / 2 - 4}" height="${rH}" fill="#C79A5B" title="Week ${i + 1}: ${w.newReviews} new reviews"/>`;
                }

                // Value labels (hide 0)
                if (w.newUsers > 0) {
                    barsHtml += `<text x="${x + barW / 4 - 2}" y="${baseY - uH - 6}" font-size="10" fill="#4A2411" font-weight="600" text-anchor="middle">${w.newUsers}</text>`;
                }
                if (w.newReviews > 0) {
                    barsHtml += `<text x="${x + barW / 2 + barW / 4 - 2}" y="${baseY - rH - 6}" font-size="10" fill="#C79A5B" font-weight="600" text-anchor="middle">${w.newReviews}</text>`;
                }

                // X labels (horizontal, no rotation)
                labelsHtml += `<text x="${x + barW / 2}" y="${baseY + 22}" font-size="11" fill="#7D6757" text-anchor="middle" font-weight="600">${i + 1}</text>`;

                hiddenTable += `<tr><td>Week ${i + 1}</td><td>${w.newUsers}</td><td>${w.newReviews}</td></tr>`;
            });

            hiddenTable += '</tbody></table>';

            // Y axis ticks
            const yTicks = [1, 2, 5, 10, 20, 50, 100].find(t => maxVal / t <= 5) || 5;
            const yTickCount = Math.ceil(maxVal / yTicks);
            let yAxisHtml = '';
            for (let i = 0; i <= yTickCount; i++) {
                const val = i * yTicks;
                const y = baseY - (val / maxVal) * barH;
                yAxisHtml += `<line x1="45" y1="${y}" x2="60" y2="${y}" stroke="#EADFD1" stroke-width="1"/>`;
                yAxisHtml += `<text x="40" y="${y + 3}" font-size="10" fill="#7D6757" text-anchor="end">${val}</text>`;
            }

            const svg = `
                <svg width="${svgW}" height="${svgH}" role="img" aria-label="New users and reviews per week for ${monthName}. Total new users: ${weeks.reduce((s,w)=>s+w.newUsers,0)}, total new reviews: ${weeks.reduce((s,w)=>s+w.newReviews,0)}">
                    <defs>
                        <linearGradient id="gradUsers" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#4A2411" stop-opacity="0.9"/>
                            <stop offset="100%" stop-color="#4A2411" stop-opacity="0.6"/>
                        </linearGradient>
                        <linearGradient id="gradReviews" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#C79A5B" stop-opacity="0.9"/>
                            <stop offset="100%" stop-color="#C79A5B" stop-opacity="0.6"/>
                        </linearGradient>
                    </defs>
                    <!-- Y axis gridlines -->
                    ${yAxisHtml}
                    <!-- Bars -->
                    ${barsHtml}
                    <!-- X labels -->
                    ${labelsHtml}
                    <!-- X axis line -->
                    <line x1="60" y1="${baseY}" x2="${svgW - 20}" y2="${baseY}" stroke="#EADFD1" stroke-width="2"/>
                    <!-- X axis label -->
                    <text x="${svgW / 2}" y="${baseY + 32}" font-size="11" fill="#4A2411" text-anchor="middle" font-weight="600">weeks</text>
                </svg>
                <!-- Legend -->
                <div class="chart-legend">
                    <div class="legend-item"><span class="legend-color" style="background:#4A2411"></span> Users</div>
                    <span class="legend-separator">•</span>
                    <div class="legend-item"><span class="legend-color" style="background:#C79A5B"></span> Reviews</div>
                </div>
                <div class="visually-hidden">${hiddenTable}</div>
            `;

            return svg;
        }

        // ---------- wiring ----------

        function wireDashboardEvents() {
            const content = document.getElementById('pageContent');

            // Period selectors
            const yearSel = document.getElementById('trendYear');
            const monthSel = document.getElementById('trendMonth');
            if (yearSel && monthSel) {
                // Populate year select
                for (let y = earliestYear; y <= new Date().getFullYear(); y++) {
                    const opt = document.createElement('option');
                    opt.value = y;
                    opt.textContent = y;
                    if (y === selYear) opt.selected = true;
                    yearSel.appendChild(opt);
                }
                // Populate month select
                const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'];
                for (let m = 1; m <= 12; m++) {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = monthNames[m - 1];
                    if (m === selMonth) opt.selected = true;
                // Disable future months
                const today = new Date();
                if (selYear > today.getFullYear() || (selYear === today.getFullYear() && m > today.getMonth() + 1)) {
                        opt.disabled = true;
                    }
                    monthSel.appendChild(opt);
                }

                yearSel.addEventListener('change', () => {
                    selYear = parseInt(yearSel.value, 10);
                    loadDashboard();
                });
                monthSel.addEventListener('change', () => {
                    selMonth = parseInt(monthSel.value, 10);
                    loadDashboard();
                });
            }

            // Refresh button
            const btnRefresh = document.getElementById('btnRefresh');
            if (btnRefresh) {
                btnRefresh.addEventListener('click', () => {
                    loadDashboard();
                });
            }

            // Needs attention card links
            content.querySelectorAll('[data-nav]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = el.dataset.nav;
                });
            });

            // Update sidebar user info
            updateSidebarUserInfo();
        }
    </script>
