<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Book Community Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg);
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }
        .login-card h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Book Community Admin</h1>
            <div id="alert" style="display: none;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.875rem; color: var(--text-light);">
                Admin access required
            </p>
        </div>
    </div>

    <script type="module">
        import { auth } from '../js/auth.js';
        
        const loginForm = document.getElementById('loginForm');
        const alertDiv = document.getElementById('alert');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            alertDiv.style.display = 'none';
            
            try {
                await auth.login(email, password);
                // Check if user is admin
                await auth.loadCurrentUser();
                if (!auth.isAdmin()) {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.textContent = 'Admin access required. Your account does not have admin privileges.';
                    alertDiv.style.display = 'block';
                    api.setAuthToken(null);
                    auth.currentUser = null;
                    return;
                }
                window.location.href = 'dashboard.html';
            } catch (error) {
                alertDiv.className = 'alert alert-error';
                alertDiv.textContent = error.message;
                alertDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
