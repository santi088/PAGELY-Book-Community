<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Book Community Admin</title>
    <link rel="stylesheet" href="../css/styles.css?v=20261126a">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg);
        }
        .login-card {
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 1.75rem;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-md);
        }
        .login-card h1 {
            text-align: center;
            margin-bottom: 0.25rem;
            font-family: var(--font-display);
            font-weight: 400;
            font-size: 1.9rem;
            letter-spacing: 0.18em;
        }
        .login-card .logo { display: block; width: 64px; margin: 0 auto 0.75rem; }
        .login-card .tag { text-align: center; color: var(--text-light); font-size: 0.875rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <img class="logo" src="../img/pagely_logo.png" alt="">
            <h1>PAGELY</h1>
            <p class="tag">Community admin</p>
            <div id="alert" style="display: none;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.875rem; color: var(--text-light);">
                Admin access required
            </p>
        </div>
    </div>

    <script type="module">
        import { auth } from '../js/auth.js';
        
        const loginForm = document.getElementById('loginForm');
        const alertDiv = document.getElementById('alert');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            alertDiv.style.display = 'none';
            
            try {
                await auth.login(email, password);
                // Check if user is admin
                try {
                    await auth.loadCurrentUser();
                } catch (e) {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.textContent = 'Failed to load user details: ' + e.message;
                    alertDiv.style.display = 'block';
                    api.setAuthToken(null);
                    auth.currentUser = null;
                    return;
                }
                if (!auth.isAdmin()) {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.textContent = 'Admin access required. Your account does not have admin privileges. Roles: ' + JSON.stringify(auth.currentUser?.roles || auth.currentUser?.Roles);
                    alertDiv.style.display = 'block';
                    api.setAuthToken(null);
                    auth.currentUser = null;
                    return;
                }
                window.location.href = 'dashboard.html';
            } catch (error) {
                alertDiv.className = 'alert alert-error';
                alertDiv.textContent = error.message;
                alertDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
