<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Pagely Admin</title>
    <link rel="stylesheet" href="../css/styles.css?v=20261126a">
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { auth } from '../js/auth.js';
        import { api } from '../js/api.js';
        import { renderLayout, initLayout } from '../js/layout.js';
        import { renderToolbar, renderPagination } from '../js/components.js';
        import { createListStore, bindListToolbar } from '../js/list-utils.js';

        // ---- state ---------------------------------------------------------
        let store = null;
        let genres = [];

        const ICON_SEARCH = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 100 14 7 7 0 000-14z"/><path d="M16.5 16.5L21 21"/></svg>';
        const ICON_GLOBE = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4A2411" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.8 3 2.8 15 0 18"/><path d="M12 3c-2.8 3-2.8 15 0 18"/></svg>';
        const ICON_SHELF = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4A2411" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h3.2v15H4z"/><path d="M9.2 4.5h3.2v15H9.2z"/><path d="M14.3 5.6l3-.8 3.6 14.1-3 .8z"/></svg>';

        // ---- boot ----------------------------------------------------------
        const ok = await auth.requireAdmin();
        if (ok) {
            document.getElementById('app').innerHTML = renderLayout(
                'Books',
                'Manage the books already in your community catalog, or find new ones on Open Library and import them.',
                'CATALOG');
            initLayout();

            if (!window.__adminEscapeBound) {
                window.__adminEscapeBound = true;
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') hideBookForm();
                });
            }

            // Load genres for the genre filter (real source from DB)
            const genresResp = await api.get('/api/genres');
            genres = Array.isArray(genresResp) ? genresResp : [];

            store = createListStore({
                search: '',
                filters: { genre: '', isActive: '' },
                sort: 'created:desc',
                page: 1,
                pageSize: 24
            });

            store.subscribe(() => {
                loadCatalog(store.get().page);
            });
        }

        // ---- layout --------------------------------------------------------
        function shellHtml() {
            return `
                <div class="tabs" role="tablist" aria-label="Book sources">
                    <button class="tab" role="tab" id="tab-catalog" data-tab="catalog" aria-controls="panel-catalog">
                        Imported Books <span class="count" id="catalogCount">…</span>
                    </button>
                    <button class="tab" role="tab" id="tab-openlibrary" data-tab="openlibrary" aria-controls="panel-openlibrary">
                        Search Open Library
                    </button>
                </div>

                <section class="tab-panel" id="panel-catalog" role="tabpanel" aria-labelledby="tab-catalog">
                    <div id="catalogToolbar"></div>
                    <div id="catalogResults"></div>
                    <div id="catalogPager"></div>
                </section>

                <section class="tab-panel" id="panel-openlibrary" role="tabpanel" aria-labelledby="tab-openlibrary" hidden>
                    <div class="panel-intro">
                        <div class="icon-tile">${ICON_GLOBE}</div>
                        <div>
                            <h2>Find books on Open Library</h2>
                            <p>Search by title, author or ISBN. Importing adds the book to your catalog with its cover and details.</p>
                        </div>
                    </div>
                    <div class="searchbar">
                        ${ICON_SEARCH}
                        <input type="search" id="importQuery" placeholder="Title, author or ISBN…" autocomplete="off">
                        <button class="btn btn-secondary btn-sm" id="importClearBtn" type="button" hidden>Clear</button>
                        <button class="btn btn-primary" id="importSearchBtn" type="button">Search</button>
                    </div>
                    <div id="importMessage"></div>
                    <div id="importResults"></div>
                </section>

                <div id="bookModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3 id="formTitle">Add New Book</h3>
                            <button class="modal-close" data-action="hideBookForm" aria-label="Close">&times;</button>
                        </div>
                        <div class="modal-body">
                            <form id="bookForm">
                                <div class="form-group">
                                    <label for="bookTitle">Title <span style="color: var(--danger);">*</span></label>
                                    <input type="text" id="bookTitle" required>
                                </div>
                                <div class="form-group">
                                    <label for="bookAuthor">Author <span style="color: var(--danger);">*</span></label>
                                    <input type="text" id="bookAuthor" required>
                                </div>
                                <div class="form-group">
                                    <label for="bookDescription">Description</label>
                                    <textarea id="bookDescription" rows="3"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="bookISBN">ISBN</label>
                                    <input type="text" id="bookISBN">
                                </div>
                                <div class="form-group">
                                    <label for="bookPublicationYear">Publication Year</label>
                                    <input type="number" id="bookPublicationYear" min="1000" max="9999">
                                </div>
                                <div class="form-group">
                                    <label for="bookCoverImageUrl">Cover Image URL</label>
                                    <input type="url" id="bookCoverImageUrl">
                                </div>
                                <div class="form-group">
                                    <label for="bookIsActive">Visible to readers</label>
                                    <select id="bookIsActive">
                                        <option value="true">Yes</option>
                                        <option value="false">No</option>
                                    </select>
                                </div>
                                <div id="bookFormError" class="alert alert-error" style="display: none;"></div>
                                <div style="display: flex; gap: 0.5rem;">
                                    <button type="submit" class="btn btn-primary">Save Book</button>
                                    <button type="button" class="btn btn-secondary" data-action="hideBookForm">Cancel</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        // ---- imported books tab ------------------------------------------------
        async function loadCatalog(page = 1) {
            const results = document.getElementById('catalogResults');
            const toolbar = document.getElementById('catalogToolbar');
            const pager = document.getElementById('catalogPager');

            if (!store) return;

            const s = store.get();
            results.innerHTML = '<div class="book-grid">' + '<div class="skeleton" style="aspect-ratio:2/3;height:auto"></div>'.repeat(6) + '</div>';
            toolbar.innerHTML = '';
            pager.innerHTML = '';

            try {
                const [sortBy, sortOrder] = s.sort.split(':');
                const params = store.toParams();
                if (sortBy) params.set('sortBy', sortBy);
                if (sortOrder) params.set('sortOrder', sortOrder);

                const data = await api.get(`/api/books?${params.toString()}`);
                const books = data.items || data.Items || [];
                const total = data.totalCount ?? data.TotalCount ?? 0;
                const pageNum = data.page || data.Page || 1;
                const totalPages = data.totalPages || data.TotalPages || 1;

                if (!s.search) {
                    document.getElementById('catalogCount').textContent = total;
                }

                // Render toolbar
                toolbar.innerHTML = renderToolbar({
                    searchPlaceholder: 'Search imported books by title or author…',
                    searchValue: s.search,
                    filters: [
                        {
                            key: 'genre',
                            options: [
                                { value: '', label: 'All genres' },
                                ...genres.map(g => ({ value: g.name || g.Name, label: g.name || g.Name }))
                            ],
                            value: s.filters.genre || ''
                        },
                        {
                            key: 'isActive',
                            options: [
                                { value: '', label: 'All' },
                                { value: 'true', label: 'Visible' },
                                { value: 'false', label: 'Hidden' }
                            ],
                            value: s.filters.isActive || ''
                        }
                    ],
                    sortOptions: [
                        { value: 'created:desc', label: 'Newest added' },
                        { value: 'created:asc', label: 'Oldest added' },
                        { value: 'title:asc', label: 'Title A-Z' },
                        { value: 'title:desc', label: 'Title Z-A' },
                        { value: 'author:asc', label: 'Author A-Z' },
                        { value: 'author:desc', label: 'Author Z-A' },
                        { value: 'rating:desc', label: 'Highest rated' },
                        { value: 'reviewcount:desc', label: 'Most reviewed' }
                    ],
                    sortValue: s.sort
                });

                // Render books grid
                if (books.length === 0) {
                    results.innerHTML = s.search
                        ? `<div class="empty-state card"><strong>No imported books match “${escapeHtml(s.search)}”</strong>Try another title or author, or look for it on the Open Library tab.
                            <div style="margin-top:1rem"><button class="btn btn-primary btn-sm" data-tab="openlibrary">Search Open Library</button></div></div>`
                        : `<div class="empty-state card"><strong>Your catalog is empty</strong>Import books from Open Library, or add one manually.
                            <div style="margin-top:1rem"><button class="btn btn-primary btn-sm" data-tab="openlibrary">Search Open Library</button></div></div>`;
                } else {
                    let html = '<div class="book-grid">';
                    for (const book of books) {
                        const id = book.id || book.Id;
                        const title = book.title || book.Title || '';
                        const author = book.author || book.Author || '';
                        const rating = Number(book.averageRating ?? book.AverageRating ?? 0);
                        const reviews = book.reviewCount ?? book.ReviewCount ?? 0;
                        const active = (book.isActive ?? book.IsActive) !== false;
                        const cover = book.coverImageUrl || book.CoverImageUrl || '';
                        html += `
                            <article class="book-card">
                                ${coverHtml(cover, title, active ? '' : '<span class="flag">Hidden</span>')}
                                <h3 title="${escapeHtml(title)}">${escapeHtml(title)}</h3>
                                <div class="author">${escapeHtml(author || 'Unknown author')}</div>
                                <div class="meta"><span style="color:var(--color-accent)">★</span> ${rating ? rating.toFixed(1) : '–'} <span>· ${reviews} ${reviews === 1 ? 'review' : 'reviews'}</span></div>
                                <div class="actions">
                                    <button class="btn btn-sm btn-secondary" data-action="editBook" data-id="${id}">Edit</button>
                                    <button class="btn btn-sm btn-ghost" data-action="deleteBook" data-id="${id}" data-title="${escapeHtml(title)}" style="color:var(--danger)">Remove</button>
                                </div>
                            </article>`;
                    }
                    html += '</div>';
                    results.innerHTML = html;
                }

                // Render pagination
                if (totalPages > 1) {
                    pager.innerHTML = renderPagination(pageNum, s.pageSize, total);
                }

                // Bind toolbar events via shared module (debounce 300ms, state persists)
                bindListToolbar('#catalogToolbar', store, {
                    onSearch: (v) => store.setSearch(v),
                    onFilter: (key, v) => store.setFilter(key, v),
                    onSort: (v) => store.setSort(v),
                    onReset: () => store.reset(),
                    onPrev: () => store.setPage(store.get().page - 1),
                    onNext: () => store.setPage(store.get().page + 1)
                });

                // Bind pagination events (renderPagination creates its own buttons)
                const pagerEl = document.getElementById('catalogPager');
                if (pagerEl) {
                    pagerEl.querySelectorAll('.pg-prev').forEach(b => b.addEventListener('click', () => {
                        store.setPage(store.get().page - 1);
                    }));
                    pagerEl.querySelectorAll('.pg-next').forEach(b => b.addEventListener('click', () => {
                        store.setPage(store.get().page + 1);
                    }));
                }

                // Edit/Remove buttons
                results.querySelectorAll('[data-action="editBook"]').forEach(b => {
                    b.addEventListener('click', () => editBook(b.dataset.id));
                });
                results.querySelectorAll('[data-action="deleteBook"]').forEach(b => {
                    b.addEventListener('click', () => deleteBook(b.dataset.id, b.dataset.title));
                });

            } catch (error) {
                results.innerHTML = `<div class="alert alert-error">Could not load books: ${escapeHtml(error.message)}</div>`;
            }
        }

        function searchCatalog() {
            const q = document.getElementById('catalogSearch');
            // Handled by shared toolbar debounce
        }

        // ---- open library tab ----------------------------------------------------
        function renderOpenLibrary() {
            const el = document.getElementById('importResults');
            const { status, candidates } = state.ol;

            if (status === 'idle') {
                el.innerHTML = `<div class="empty-state card"><strong>Search Open Library</strong>Results will appear here. Books you import are added to the Imported Books tab.</div>`;
            } else if (status === 'loading') {
                el.innerHTML = '<div class="result-list">' + '<div class="skeleton"></div>'.repeat(3) + '</div>';
            } else if (status === 'error') {
                el.innerHTML = `<div class="empty-state card"><strong>The search did not finish</strong>
                    <div style="margin-top:1rem"><button class="btn btn-secondary btn-sm" data-action="retryOpenLibrary">Try again</button></div></div>`;
            } else if (!candidates.length) {
                el.innerHTML = `<div class="empty-state card"><strong>No Open Library results</strong>Check the spelling, or try the author or ISBN instead.</div>`;
            } else {
                el.innerHTML = `<div class="toolbar"><span class="result-count">${candidates.length} ${candidates.length === 1 ? 'result' : 'results'} from Open Library</span></div>
                    <div class="result-list">${candidates.map(candidateHtml).join('')}</div>`;
            }
        }

        function candidateHtml(c) {
            const title = c.title || '';
            const authors = c.authors && c.authors.length ? c.authors.join(', ') : 'Unknown author';
            const year = c.publicationYear || (c.publicationDate ? String(c.publicationDate).slice(0, 4) : '');
            const isbn = c.isbn13 || c.isbn10 || '';
            const desc = c.description ? (c.description.length > 220 ? c.description.slice(0, 220) + '…' : c.description) : '';
            const id = c.openLibraryId || '';
            const busy = state.ol.importing.has(id);
            return `
                <article class="result-card">
                    ${coverHtml(c.coverImageUrl, title)}
                    <div>
                        <h3>${escapeHtml(title)}</h3>
                        <div class="byline">${escapeHtml(authors)}</div>
                        <div class="chips">
                            ${year ? `<span class="chip">${escapeHtml(year)}</span>` : ''}
                            ${isbn ? `<span class="chip">ISBN ${escapeHtml(isbn)}</span>` : ''}
                        </div>
                        ${desc ? `<p class="desc">${escapeHtml(desc)}</p>` : ''}
                    </div>
                    <div class="action-col">
                        <button class="btn btn-primary" data-action="importBook" data-id="${escapeHtml(id)}" ${busy ? 'disabled' : ''}>${busy ? 'Importing…' : 'Import'}</button>
                    </div>
                </article>`;
        }

        async function searchOpenLibrary() {
            const input = document.getElementById('importQuery');
            const query = input.value.trim();
            const msg = document.getElementById('importMessage');
            const btn = document.getElementById('importSearchBtn');

            if (!query) {
                msg.innerHTML = '<div class="alert alert-warning">Enter a title, author or ISBN to search.</div>';
                return;
            }

            const requestId = ++state.ol.requestId;
            state.ol.query = query;
            state.ol.status = 'loading';
            state.ol.candidates = [];
            msg.innerHTML = '';
            btn.disabled = true;
            btn.textContent = 'Searching…';
            renderOpenLibrary();

            try {
                const result = await api.get(`/api/admin/books/search?q=${encodeURIComponent(query)}&pageSize=20`);
                if (requestId !== state.ol.requestId) return;
                state.ol.candidates = Array.isArray(result) ? result : [];
                state.ol.status = state.ol.candidates.length ? 'success' : 'empty';
            } catch (error) {
                if (requestId !== state.ol.requestId) return;
                state.ol.status = 'error';
                msg.innerHTML = `<div class="alert alert-error">${escapeHtml(
                    error.status === 401 || error.status === 403 ? 'Access denied. Admin privileges required.'
                    : error.status === 429 ? 'Open Library rate limit exceeded. Please try again later.'
                    : error.status === 504 ? 'Open Library request timed out. Please try again.'
                    : (error.message || 'Open Library search failed. Please try again.'))}</div>`;
            } finally {
                if (requestId === state.ol.requestId) {
                    btn.disabled = false;
                    btn.textContent = 'Search';
                    renderOpenLibrary();
                }
            }
        }

        function clearOpenLibrary() {
            state.ol.requestId++;
            state.ol.candidates = [];
            state.ol.status = 'idle';
            document.getElementById('importQuery').value = '';
            document.getElementById('importClearBtn').hidden = true;
            document.getElementById('importMessage').innerHTML = '';
            const btn = document.getElementById('importSearchBtn');
            btn.disabled = false;
            btn.textContent = 'Search';
            renderOpenLibrary();
        }

        async function importBook(openLibraryId) {
            if (!openLibraryId || state.ol.importing.has(openLibraryId)) return;
            state.ol.importing.add(openLibraryId);
            const msg = document.getElementById('importMessage');
            msg.innerHTML = '';
            renderOpenLibrary();

            try {
                const result = await api.post('/api/admin/books/import', { openLibraryId });
                if (result.isNewImport) {
                    msg.innerHTML = `<div class="alert alert-success">Imported “${escapeHtml(result.title)}” by ${escapeHtml(result.author)}. Find it under Imported Books.</div>`;
                } else if (result.existingIsbnMatch) {
                    msg.innerHTML = `<div class="alert alert-info">“${escapeHtml(result.title)}” is already in the catalog (ISBN ${escapeHtml(result.existingIsbnMatch)}).</div>`;
                } else {
                    msg.innerHTML = `<div class="alert alert-info">“${escapeHtml(result.title)}” is already imported.</div>`;
                }
                state.ol.candidates = state.ol.candidates.filter(c => c.openLibraryId !== openLibraryId);
                if (!state.ol.candidates.length) state.ol.status = 'empty';
                store.setPageSize(store.get().pageSize);
                if (result.isNewImport) {
                    const countEl = document.getElementById('catalogCount');
                    if (countEl) countEl.textContent = parseInt(countEl.textContent || '0') + 1;
                }
            } catch (error) {
                msg.innerHTML = `<div class="alert alert-error">Import failed: ${escapeHtml(error.message || 'Unknown error')}</div>`;
            } finally {
                state.ol.importing.delete(openLibraryId);
                renderOpenLibrary();
            }
        }

        // ---- add / edit / remove ---------------------------------------------
        function showBookForm() {
            state.editingBookId = null;
            document.getElementById('formTitle').textContent = 'Add New Book';
            document.getElementById('bookForm').reset();
            document.getElementById('bookIsActive').value = 'true';
            const err = document.getElementById('bookFormError');
            err.style.display = 'none';
            err.textContent = '';
            document.getElementById('bookModal').classList.add('active');
            document.getElementById('bookTitle').focus();
        }

        function hideBookForm() {
            document.getElementById('bookModal')?.classList.remove('active');
        }

        async function saveBook(e) {
            e.preventDefault();
            const year = document.getElementById('bookPublicationYear').value;
            const bookData = {
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                description: document.getElementById('bookDescription').value || null,
                isbn: document.getElementById('bookISBN').value || null,
                publicationYear: year ? parseInt(year, 10) : null,
                coverImageUrl: document.getElementById('bookCoverImageUrl').value || null,
                isActive: document.getElementById('bookIsActive').value === 'true'
            };
            const err = document.getElementById('bookFormError');
            err.style.display = 'none';
            err.textContent = '';

            try {
                if (state.editingBookId) {
                    await api.put(`/api/admin/books/${state.editingBookId}`, bookData);
                } else {
                    await api.post('/api/admin/books', bookData);
                }
                hideBookForm();
                loadCatalog(store.get().page);
            } catch (error) {
                err.textContent = error.message || 'Error saving book';
                err.style.display = 'block';
            }
        }

        async function editBook(id) {
            try {
                const book = await api.get(`/api/books/${id}`);
                state.editingBookId = id;
                document.getElementById('formTitle').textContent = 'Edit Book';
                document.getElementById('bookTitle').value = book.title || book.Title || '';
                document.getElementById('bookAuthor').value = book.author || book.Author || '';
                document.getElementById('bookDescription').value = book.description || book.Description || '';
                document.getElementById('bookISBN').value = book.isbn || book.ISBN || '';
                document.getElementById('bookPublicationYear').value = book.publicationYear || book.PublicationYear || '';
                document.getElementById('bookCoverImageUrl').value = book.coverImageUrl || book.CoverImageUrl || '';
                document.getElementById('bookIsActive').value = (book.isActive !== false && book.IsActive !== false) ? 'true' : 'false';
                const err = document.getElementById('bookFormError');
                err.style.display = 'none';
                err.textContent = '';
                document.getElementById('bookModal').classList.add('active');
            } catch (error) {
                alert('Error loading book: ' + error.message);
            }
        }

        async function deleteBook(id, title) {
            if (!confirm(`Remove "${title}" from the catalog? It will be deactivated, not erased.`)) return;
            try {
                await api.delete(`/api/admin/books/${id}`);
                loadCatalog(store.get().page);
            } catch (error) {
                alert('Error removing book: ' + error.message);
            }
        }

        // ---- shared helpers --------------------------------------------------
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        function coverHtml(url, title, extra = '') {
            const initial = escapeHtml((title || '?').trim().charAt(0).toUpperCase() || '?');
            const valid = url && /^https?:\/\//i.test(url);
            return `<div class="cover"><span aria-hidden="true">${initial}</span>${valid
                ? `<img src="${escapeHtml(url)}" alt="" loading="lazy" onerror="this.remove()">`
                : ''}${extra}</div>`;
        }

        function switchTab(tab, updateHash) {
            const activeTab = tab === 'openlibrary' ? 'openlibrary' : 'catalog';
            for (const name of ['catalog', 'openlibrary']) {
                const active = name === activeTab;
                const btn = document.getElementById(`tab-${name}`);
                btn.classList.toggle('active', active);
                btn.setAttribute('aria-selected', String(active));
                document.getElementById(`panel-${name}`).hidden = !active;
            }
            if (updateHash) history.replaceState(null, '', tab === 'openlibrary' ? '#openlibrary' : '#catalog');
            if (activeTab === 'catalog') loadCatalog(store.get().page);
            const focusId = activeTab === 'catalog' ? null : 'importQuery';
            if (focusId) document.getElementById(focusId)?.focus();
        }

        // Open Library state (kept separate from shared catalog store)
        const state = {
            tab: 'catalog',
            catalog: { page: 1, search: '', total: null, dirty: false },
            editingBookId: null,
            ol: { query: '', candidates: [], status: 'idle', requestId: 0, importing: new Set(), message: '' }
        };

        document.getElementById('pageContent').innerHTML = shellHtml();

        // Bind shell events
        const root = document.getElementById('pageContent');
        root.addEventListener('click', (e) => {
            const tab = e.target.closest('[data-tab]');
            if (tab) { switchTab(tab.dataset.tab, true); return; }

            const el = e.target.closest('[data-action]');
            if (!el) return;
            const { action, id, title } = el.dataset;
            switch (action) {
                case 'showBookForm': showBookForm(); break;
                case 'hideBookForm': hideBookForm(); break;
                case 'editBook': editBook(id); break;
                case 'deleteBook': deleteBook(id, title); break;
                case 'importBook': importBook(id); break;
                case 'retryOpenLibrary': searchOpenLibrary(); break;
            }
        });

        document.getElementById('bookForm').addEventListener('submit', saveBook);

        // Import clear/search buttons
        document.getElementById('importClearBtn')?.addEventListener('click', clearOpenLibrary);
        document.getElementById('importSearchBtn')?.addEventListener('click', searchOpenLibrary);
        document.getElementById('importQuery')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); searchOpenLibrary(); }
        });
        document.getElementById('importQuery')?.addEventListener('input', () => {
            document.getElementById('importClearBtn').hidden = !document.getElementById('importQuery').value;
        });

        const initial = location.hash === '#openlibrary' ? 'openlibrary' : 'catalog';
        switchTab(initial, false);
        window.addEventListener('hashchange', () => {
            switchTab(location.hash === '#openlibrary' ? 'openlibrary' : 'catalog', false);
        });
        renderOpenLibrary();
    </script>
</body>
</html>
