<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Book Community Admin</title>
    <link rel="stylesheet" href="../css/styles.css?v=20261029b">
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background-color: var(--card-bg);
            margin: 2rem auto;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-body {
            padding: 1.5rem;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { auth } from '../js/auth.js';
        import { api } from '../js/api.js';
        import { renderLayout, initLayout } from '../js/layout.js';

        let currentCatalogPage = 1;
        let currentCatalogSearch = '';
        let editingBookId = null;
        let isImporting = false;
        let importCandidates = [];
        let openLibrarySearchState = 'idle';
        let openLibrarySearchRequestId = 0;
        let isOpenLibrarySearching = false;
        let importingIds = new Set();

        const ok = await auth.requireAdmin();
        if (!ok) {
        } else {
            document.getElementById('app').innerHTML = renderLayout('Books', 'Search the local catalog and import books from Open Library.');
            initLayout();
            if (!window.__adminEscapeBound) {
                window.__adminEscapeBound = true;
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        document.querySelectorAll('.modal.active').forEach((modal) => modal.classList.remove('active'));
                    }
                });
            }
            loadBooks();
        }

        async function loadBooks(page = 1) {
            currentCatalogPage = page;
            const content = document.getElementById('pageContent');
            content.innerHTML = '<div class="loading">Loading...</div>';

            try {
                const searchParam = currentCatalogSearch ? `&search=${encodeURIComponent(currentCatalogSearch)}` : '';
                const data = await api.get(`/api/books?page=${page}&pageSize=20${searchParam}`);
                const books = data.items || data.Items || [];
                const totalCount = data.totalCount || data.TotalCount || 0;
                const pageSize = data.pageSize || data.PageSize || 20;
                const pageNum = data.page || data.Page || 1;
                const totalPages = data.totalPages || data.TotalPages || 1;

                let html = `
                    <div class="card">
                        <div class="card-header">
                            <h2>Books (${totalCount})</h2>
                            <button class="btn btn-primary" data-action="showBookForm">Add Book</button>
                        </div>

                        <div class="card" style="margin-bottom: 1rem;">
                            <div class="card-header">
                                <h3>Search existing books</h3>
                            </div>
                            <div class="form-group" style="margin-bottom: 0.5rem;">
                                <label for="catalogSearch">Search catalog</label>
                                <div style="display: flex; gap: 0.5rem;">
                                    <input type="text" id="catalogSearch" placeholder="Search by title or author" style="flex: 1; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 0.375rem; font-size: 0.875rem;">
                                    <button class="btn btn-primary" id="catalogSearchBtn" data-action="searchCatalog">Search</button>
                                    <button class="btn btn-secondary" id="catalogClearBtn" data-action="clearCatalogSearch">Clear</button>
                                </div>
                            </div>
                        </div>

                        <div id="bookModal" class="modal">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h3 id="formTitle">Add New Book</h3>
                                    <button class="modal-close" data-action="hideBookForm" aria-label="Close">&times;</button>
                                </div>
                                <div class="modal-body">
                                    <form id="bookForm">
                                        <input type="hidden" id="bookId">
                                        <div class="form-group">
                                            <label>Title <span style="color: var(--danger);">*</span></label>
                                            <input type="text" id="bookTitle" required>
                                        </div>
                                        <div class="form-group">
                                            <label>Author <span style="color: var(--danger);">*</span></label>
                                            <input type="text" id="bookAuthor" required>
                                        </div>
                                        <div class="form-group">
                                            <label>Description</label>
                                            <textarea id="bookDescription" rows="3"></textarea>
                                        </div>
                                        <div class="form-group">
                                            <label>ISBN</label>
                                            <input type="text" id="bookISBN">
                                        </div>
                                        <div class="form-group">
                                            <label>Publication Year</label>
                                            <input type="number" id="bookPublicationYear" min="1000" max="9999">
                                        </div>
                                        <div class="form-group">
                                            <label>Cover Image URL</label>
                                            <input type="url" id="bookCoverImageUrl">
                                        </div>
                                        <div class="form-group">
                                            <label>Is Active</label>
                                            <select id="bookIsActive">
                                                <option value="true">Yes</option>
                                                <option value="false">No</option>
                                            </select>
                                        </div>
                                        <div id="bookFormError" class="alert alert-error" style="display: none;"></div>
                                        <div style="display: flex; gap: 0.5rem;">
                                            <button type="submit" class="btn btn-primary">Save Book</button>
                                            <button type="button" class="btn btn-secondary" data-action="hideBookForm">Cancel</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <!-- Import from Open Library -->
                        <div class="card">
                            <div class="card-header">
                                <h2>Import from Open Library</h2>
                            </div>
                            <div class="form-group" style="margin-bottom: 1rem;">
                                <label for="importQuery">Search Open Library</label>
                                <div style="display: flex; gap: 0.5rem;">
                                    <input type="text" id="importQuery" placeholder="Enter book title, author, or ISBN" style="flex: 1; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 0.375rem; font-size: 0.875rem;">
                                    <button class="btn btn-primary" id="importSearchBtn" data-action="searchOpenLibrary">Search</button>
                                    <button class="btn btn-secondary" id="importClearBtn" data-action="clearOpenLibrarySearch">Clear</button>
                                </div>
                                <div id="importError" class="alert alert-error" style="display: none; margin-top: 0.5rem;"></div>
                                <div style="margin-top: 0.5rem;">
                                    <button class="btn btn-secondary btn-sm" data-action="retryOpenLibrarySearch" style="display: none;">Retry</button>
                                </div>
                            </div>

                            <div id="importLoading" class="loading" style="display: none;"></div>

                            <div id="importResults" style="margin-top: 1rem;">
                                ${importCandidates.length === 0 ? '<p class="empty-state">Search for books to import from Open Library.</p>' : renderImportCandidates(importCandidates)}
                            </div>

                            <div id="importMessage" style="margin-top: 1rem;"></div>
                        </div>

                        <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Author</th>
                                    <th>Rating</th>
                                    <th>Reviews</th>
                                    <th>Active</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                if (books.length === 0) {
                    html += '<tr><td colspan="6" class="empty-state">No books found</td></tr>';
                } else {
                    for (const book of books) {
                        const id = book.id || book.Id;
                        html += `
                            <tr>
                                <td>${escapeHtml(book.title || book.Title || '')}</td>
                                <td>${escapeHtml(book.author || book.Author || '')}</td>
                                <td>${book.averageRating || book.AverageRating || 0}</td>
                                <td>${book.reviewCount || book.ReviewCount || 0}</td>
                                <td>${book.isActive !== false ? 'Yes' : 'No'}</td>
                                <td>
                                    <button class="btn btn-sm btn-secondary" data-action="editBook" data-id="${id}">Edit</button>
                                    <button class="btn btn-sm btn-danger" data-action="deleteBook" data-id="${id}" data-title="${escapeHtml(book.title || book.Title || '')}">Delete</button>
                                </td>
                            </tr>
                        `;
                    }
                }

                html += `
                            </tbody>
                        </table>
                        </div>

                        <div class="pagination">
                            ${pageNum > 1 ? `<button data-action="prevPage" data-page="${pageNum - 1}">Previous</button>` : '<button disabled>Previous</button>'}
                            <span>Page ${pageNum} of ${totalPages}</span>
                            ${pageNum < totalPages ? `<button data-action="nextPage" data-page="${pageNum + 1}">Next</button>` : '<button disabled>Next</button>'}
                        </div>
                    </div>
                `;

                content.innerHTML = html;
                attachBookListeners(content);
            } catch (error) {
                content.innerHTML = `<div class="alert alert-error">Error: ${error.message}</div>`;
            }
        }

        function attachBookListeners(content) {
            // Book form
            content.querySelectorAll('[data-action="showBookForm"]').forEach(b => {
                b.addEventListener('click', showBookForm);
            });
            content.querySelectorAll('[data-action="hideBookForm"]').forEach(b => {
                b.addEventListener('click', hideBookForm);
            });
            const form = content.querySelector('#bookForm');
            if (form) {
                form.addEventListener('submit', saveBook);
            }

            // Book actions
            content.querySelectorAll('[data-action="editBook"]').forEach(b => {
                b.addEventListener('click', () => editBook(b.dataset.id));
            });
            content.querySelectorAll('[data-action="deleteBook"]').forEach(b => {
                b.addEventListener('click', () => deleteBook(b.dataset.id, b.dataset.title));
            });

            // Pagination
            content.querySelectorAll('[data-action="prevPage"]').forEach(b => {
                b.addEventListener('click', () => loadBooks(parseInt(b.dataset.page)));
            });
            content.querySelectorAll('[data-action="nextPage"]').forEach(b => {
                b.addEventListener('click', () => loadBooks(parseInt(b.dataset.page)));
            });

            // Import search
            content.querySelectorAll('[data-action="searchOpenLibrary"]').forEach(b => {
                b.addEventListener('click', () => searchOpenLibrary());
            });
            content.querySelectorAll('[data-action="clearOpenLibrarySearch"]').forEach(b => {
                b.addEventListener('click', clearOpenLibrarySearch);
            });
            content.querySelectorAll('[data-action="retryOpenLibrarySearch"]').forEach(b => {
                b.addEventListener('click', () => searchOpenLibrary(true));
            });

            const importQueryInput = content.querySelector('#importQuery');
            if (importQueryInput) {
                importQueryInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        searchOpenLibrary();
                    }
                });
            }
            content.querySelectorAll('[data-action="searchCatalog"]').forEach(b => {
                b.addEventListener('click', searchCatalog);
            });
            content.querySelectorAll('[data-action="clearCatalogSearch"]').forEach(b => {
                b.addEventListener('click', clearCatalogSearch);
            });

            // Import book buttons
            content.querySelectorAll('[data-action="importBook"]').forEach(b => {
                b.addEventListener('click', () => importBook(b.dataset.id));
            });
        }

        function renderImportCandidates(candidates, state = 'success') {
            if (state === 'empty') {
                return '<p class="empty-state">No Open Library results found.</p>';
            }
            if (state === 'error') {
                return '<p class="empty-state">Open Library search failed. Use Retry to try again.</p>';
            }
            if (!Array.isArray(candidates) || candidates.length === 0) {
                return '<p class="empty-state">No Open Library results found.</p>';
            }

            let html = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;">';
            for (const candidate of candidates) {
                const coverUrl = candidate.coverImageUrl || '';
                const isValidUrl = !!(coverUrl && coverUrl.indexOf('http') === 0);
                const title = escapeHtml(candidate.title || '');
                const authors = candidate.authors && candidate.authors.length ? candidate.authors.join(', ') : 'Unknown author';
                const pubDate = candidate.publicationDate || candidate.publicationYear || 'Unknown date';
                const isbn = candidate.isbn13 || candidate.isbn10 || 'Not available';
                const description = candidate.description ? escapeHtml(candidate.description).substring(0, 150) + (candidate.description.length > 150 ? '...' : '') : 'No description available';
                const openLibraryId = escapeHtml(candidate.openLibraryId || '');

                html += `
                    <article class="google-card">
                        ${isValidUrl ? `<img class="google-cover" src="${escapeHtml(coverUrl)}" alt="${title}">` : `<div class="google-cover-placeholder">No cover</div>`}
                        <div class="google-meta">
                            <h4>${title}</h4>
                            <p>By ${escapeHtml(authors)}</p>
                            <p>${escapeHtml(pubDate)}</p>
                            <p>ISBN: ${escapeHtml(isbn)}</p>
                            <p>${description}</p>
                            <div class="google-actions">
                                <button class="btn btn-primary btn-sm" data-action="importBook" data-id="${openLibraryId}" ${importingIds.has(candidate.openLibraryId) ? 'disabled' : ''}>${importingIds.has(candidate.openLibraryId) ? 'Importing...' : 'Import Book'}</button>
                            </div>
                        </div>
                    </article>
                `;
            }
            html += '</div>';
            return html;
        }

        async function searchCatalog() {
            const input = document.getElementById('catalogSearch');
            const q = input ? input.value.trim() : '';
            currentCatalogSearch = q;
            currentCatalogPage = 1;
            await loadBooks(1);
        }

        async function clearCatalogSearch() {
            const input = document.getElementById('catalogSearch');
            if (input) input.value = '';
            currentCatalogSearch = '';
            currentCatalogPage = 1;
            await loadBooks(1);
        }

        async function searchOpenLibrary(force = false) {
            const queryInput = document.getElementById('importQuery');
            const query = queryInput ? queryInput.value.trim() : '';
            const errorDiv = document.getElementById('importError');
            const resultsDiv = document.getElementById('importResults');
            const loadingDiv = document.getElementById('importLoading');
            const searchBtn = document.getElementById('importSearchBtn');

            if (!query) {
                if (errorDiv) {
                    errorDiv.textContent = 'Please enter a search query.';
                    errorDiv.style.display = 'block';
                }
                return;
            }

            if (isOpenLibrarySearching && !force) return;
            const requestId = ++openLibrarySearchRequestId;
            isOpenLibrarySearching = true;
            openLibrarySearchState = 'loading';
            importCandidates = [];
            if (errorDiv) { errorDiv.style.display = 'none'; errorDiv.textContent = ''; }
            if (resultsDiv) resultsDiv.innerHTML = '<div class="loading">Searching Open Library...</div>';
            if (loadingDiv) loadingDiv.style.display = 'block';
            if (searchBtn) { searchBtn.disabled = true; searchBtn.textContent = 'Searching...'; }

            try {
                const result = await api.get(`/api/admin/books/search?q=${encodeURIComponent(query)}&pageSize=20`);
                if (requestId !== openLibrarySearchRequestId) return;
                importCandidates = Array.isArray(result) ? result : [];
                openLibrarySearchState = importCandidates.length === 0 ? 'empty' : 'success';
                if (resultsDiv) resultsDiv.innerHTML = renderImportCandidates(importCandidates, openLibrarySearchState);
                const content = document.getElementById('pageContent');
                if (content) attachBookListeners(content);
                const retryBtn = document.querySelector('[data-action="retryOpenLibrarySearch"]');
                if (retryBtn) retryBtn.style.display = 'none';
            } catch (error) {
                if (requestId !== openLibrarySearchRequestId) return;
                openLibrarySearchState = 'error';
                importCandidates = [];
                if (errorDiv) {
                    errorDiv.textContent = error.status === 401 || error.status === 403
                        ? 'Access denied. Admin privileges required.'
                        : (error.status === 429 ? 'Open Library rate limit exceeded. Please try again later.'
                            : (error.status === 504 ? 'Open Library request timed out. Please try again.'
                                : (error.message || 'Open Library search failed. Please try again.')));
                    errorDiv.style.display = 'block';
                }
                const retryBtn = document.querySelector('[data-action="retryOpenLibrarySearch"]');
                if (retryBtn) retryBtn.style.display = 'inline-block';
                if (resultsDiv) resultsDiv.innerHTML = renderImportCandidates([], 'error');
            } finally {
                if (requestId === openLibrarySearchRequestId) {
                    isOpenLibrarySearching = false;
                    if (loadingDiv) loadingDiv.style.display = 'none';
                    if (searchBtn) { searchBtn.disabled = false; searchBtn.textContent = 'Search'; }
                }
            }
        }

        function clearOpenLibrarySearch() {
            const queryInput = document.getElementById('importQuery');
            const errorDiv = document.getElementById('importError');
            const resultsDiv = document.getElementById('importResults');
            if (queryInput) queryInput.value = '';
            if (errorDiv) { errorDiv.style.display = 'none'; errorDiv.textContent = ''; }
            importCandidates = [];
            openLibrarySearchState = 'idle';
            const retryBtn = document.querySelector('[data-action="retryOpenLibrarySearch"]');
            if (retryBtn) retryBtn.style.display = 'none';
            if (resultsDiv) resultsDiv.innerHTML = '<p class="empty-state">Search for books to import from Open Library.</p>';
        }

        async function importBook(openLibraryId) {
            if (isImporting || importingIds.has(openLibraryId)) return;
            isImporting = true;
            importingIds.add(openLibraryId);

            const messageDiv = document.getElementById('importMessage');
            const resultsDiv = document.getElementById('importResults');
            if (messageDiv) messageDiv.innerHTML = '';
            if (resultsDiv) resultsDiv.innerHTML = renderImportCandidates(importCandidates, openLibrarySearchState);
            const content = document.getElementById('pageContent');
            if (content) attachBookListeners(content);

            try {
                const result = await api.post('/api/admin/books/import', { openLibraryId });

                if (result.isNewImport) {
                    if (messageDiv) messageDiv.innerHTML = `<div class="alert alert-success">Successfully imported "${escapeHtml(result.title)}" by ${escapeHtml(result.author)}.</div>`;
                } else if (result.existingIsbnMatch) {
                    if (messageDiv) messageDiv.innerHTML = `<div class="alert alert-info">"${escapeHtml(result.title)}" already exists in the catalog (ISBN: ${escapeHtml(result.existingIsbnMatch)}).</div>`;
                } else {
                    if (messageDiv) messageDiv.innerHTML = `<div class="alert alert-info">"${escapeHtml(result.title)}" is already imported from Open Library.</div>`;
                }
                importCandidates = importCandidates.filter(c => c.openLibraryId !== openLibraryId);
                if (resultsDiv) resultsDiv.innerHTML = renderImportCandidates(importCandidates, openLibrarySearchState);
                const content = document.getElementById('pageContent');
                if (content) attachBookListeners(content);
                await loadBooks(currentCatalogPage);
            } catch (error) {
                if (messageDiv) messageDiv.innerHTML = `<div class="alert alert-error">Import failed: ${error.message || 'Unknown error'}</div>`;
            } finally {
                importingIds.delete(openLibraryId);
                isImporting = false;
                const latestResultsDiv = document.getElementById('importResults');
                if (latestResultsDiv) latestResultsDiv.innerHTML = renderImportCandidates(importCandidates, openLibrarySearchState);
                const content = document.getElementById('pageContent');
                if (content) attachBookListeners(content);
            }
        }

function showBookForm() {
            editingBookId = null;
            document.getElementById('bookId').value = '';
            document.getElementById('formTitle').textContent = 'Add New Book';
            document.getElementById('bookForm').reset();
            document.getElementById('bookIsActive').value = 'true';
            const err = document.getElementById('bookFormError');
            if (err) { err.style.display = 'none'; err.textContent = ''; }
            const modal = document.getElementById('bookModal');
            if (modal) modal.classList.add('active');
        }

        function hideBookForm() {
            const modal = document.getElementById('bookModal');
            if (modal) modal.classList.remove('active');
        }

        async function saveBook(e) {
            e.preventDefault();
            const bookData = {
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                description: document.getElementById('bookDescription').value || null,
                isbn: document.getElementById('bookISBN').value || null,
                publicationYear: document.getElementById('bookPublicationYear').value ? parseInt(document.getElementById('bookPublicationYear').value) : null,
                coverImageUrl: document.getElementById('bookCoverImageUrl').value || null,
                isActive: document.getElementById('bookIsActive').value === 'true'
            };
            const err = document.getElementById('bookFormError');
            if (err) { err.style.display = 'none'; err.textContent = ''; }

            try {
                if (editingBookId) {
                    await api.put(`/api/admin/books/${editingBookId}`, bookData);
                } else {
                    await api.post('/api/admin/books', bookData);
                }
                hideBookForm();
                loadBooks(1);
            } catch (error) {
                if (err) {
                    err.textContent = error.message || 'Error saving book';
                    err.style.display = 'block';
                } else {
                    alert('Error saving book: ' + error.message);
                }
            }
        }

        async function editBook(id) {
            try {
                const data = await api.get(`/api/books/${id}`);
                const book = data;
                editingBookId = id;
                document.getElementById('formTitle').textContent = 'Edit Book';
                document.getElementById('bookId').value = id;
                document.getElementById('bookTitle').value = book.title || book.Title || '';
                document.getElementById('bookAuthor').value = book.author || book.Author || '';
                document.getElementById('bookDescription').value = book.description || book.Description || '';
                document.getElementById('bookISBN').value = book.isbn || book.ISBN || '';
                document.getElementById('bookPublicationYear').value = book.publicationYear || book.PublicationYear || '';
                document.getElementById('bookCoverImageUrl').value = book.coverImageUrl || book.CoverImageUrl || '';
                document.getElementById('bookIsActive').value = (book.isActive !== false && book.IsActive !== false) ? 'true' : 'false';
                const err = document.getElementById('bookFormError');
                if (err) { err.style.display = 'none'; err.textContent = ''; }
                const modal = document.getElementById('bookModal');
                if (modal) modal.classList.add('active');
            } catch (error) {
                alert('Error loading book: ' + error.message);
            }
        }

        async function deleteBook(id, title) {
            if (!confirm(`Are you sure you want to deactivate "${title}"?`)) return;
            try {
                await api.delete(`/api/admin/books/${id}`);
                loadBooks(1);
            } catch (error) {
                alert('Error deleting book: ' + error.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

</script>
</body>
</html>
