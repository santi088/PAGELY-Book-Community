<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genres - Book Community Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { auth } from '../js/auth.js';
        import { api } from '../js/api.js';
        import { renderLayout, initLayout } from '../js/layout.js';
        
        const ok = await auth.requireAdmin();
        if (!ok) {
        } else {
            document.getElementById('app').innerHTML = renderLayout('Genres Management');
            initLayout();
            loadGenres();
        }

        let editingGenreId = null;

        async function loadGenres() {
            const content = document.getElementById('pageContent');
            content.innerHTML = '<div class="loading">Loading...</div>';

            try {
                const genres = await api.get('/api/genres');
                const genreList = Array.isArray(genres) ? genres : [];

                let html = `
                    <div class="card">
                        <div class="card-header">
                            <h2>Genres (${genreList.length})</h2>
                            <button class="btn btn-primary" onclick="showGenreForm()">Add Genre</button>
                        </div>

                        <div id="genreFormContainer" style="display: none; margin-bottom: 1rem;">
                            <div class="card">
                                <div class="card-header">
                                    <h3 id="genreFormTitle">Add New Genre</h3>
                                    <button class="btn btn-secondary btn-sm" onclick="hideGenreForm()" style="float: right;">Cancel</button>
                                </div>
                                <form id="genreForm" onsubmit="saveGenre(event)">
                                    <input type="hidden" id="genreId">
                                    <div class="form-group">
                                        <label>Name <span style="color: var(--danger);">*</span></label>
                                        <input type="text" id="genreName" required>
                                    </div>
                                    <div class="form-group">
                                        <label>Description</label>
                                        <textarea id="genreDescription" rows="3"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Save Genre</button>
                                </form>
                            </div>
                        </div>

                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                if (genreList.length === 0) {
                    html += '<tr><td colspan="3" class="empty-state">No genres found</td></tr>';
                } else {
                    for (const genre of genreList) {
                        const id = genre.id || genre.Id;
                        html += `
                            <tr>
                                <td>${escapeHtml(genre.name || genre.Name || '')}</td>
                                <td>${escapeHtml(genre.description || genre.Description || '')}</td>
                                <td>
                                    <button class="btn btn-sm btn-secondary" onclick="editGenre('${id}')">Edit</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteGenre('${id}', '${escapeHtml(genre.name || genre.Name || '')}')">Delete</button>
                                </td>
                            </tr>
                        `;
                    }
                }

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `<div class="alert alert-error">Error: ${error.message}</div>`;
            }
        }

        function showGenreForm() {
            editingGenreId = null;
            document.getElementById('genreId').value = '';
            document.getElementById('genreFormTitle').textContent = 'Add New Genre';
            document.getElementById('genreForm').reset();
            document.getElementById('genreFormContainer').style.display = 'block';
        }

        function hideGenreForm() {
            document.getElementById('genreFormContainer').style.display = 'none';
        }

        async function saveGenre(e) {
            e.preventDefault();
            const genreData = {
                name: document.getElementById('genreName').value,
                description: document.getElementById('genreDescription').value || null
            };

            try {
                if (editingGenreId) {
                    await api.put(`/api/admin/genres/${editingGenreId}`, genreData);
                } else {
                    await api.post('/api/admin/genres', genreData);
                }
                hideGenreForm();
                loadGenres();
            } catch (error) {
                alert('Error saving genre: ' + error.message);
            }
        }

        async function editGenre(id) {
            // GET /api/genres returns all genres; find the one we want
            try {
                const genres = await api.get('/api/genres');
                const genreList = Array.isArray(genres) ? genres : [];
                const genre = genreList.find(g => (g.id || g.Id) === id);
                if (!genre) throw new Error('Genre not found');

                editingGenreId = id;
                document.getElementById('genreFormTitle').textContent = 'Edit Genre';
                document.getElementById('genreId').value = id;
                document.getElementById('genreName').value = genre.name || genre.Name || '';
                document.getElementById('genreDescription').value = genre.description || genre.Description || '';
                document.getElementById('genreFormContainer').style.display = 'block';
            } catch (error) {
                alert('Error loading genre: ' + error.message);
            }
        }

        async function deleteGenre(id, name) {
            if (!confirm(`Are you sure you want to delete genre "${name}"?`)) return;
            try {
                await api.delete(`/api/admin/genres/${id}`);
                loadGenres();
            } catch (error) {
                alert('Error deleting genre: ' + error.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
