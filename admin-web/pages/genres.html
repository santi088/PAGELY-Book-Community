<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genres - Book Community Admin</title>
    <link rel="stylesheet" href="../css/styles.css?v=20261029b">
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background-color: var(--card-bg);
            margin: 2rem auto;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-body {
            padding: 1.5rem;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { auth } from '../js/auth.js';
        import { api } from '../js/api.js';
        import { renderLayout, initLayout } from '../js/layout.js';

        const ok = await auth.requireAdmin();
        if (!ok) {
        } else {
            document.getElementById('app').innerHTML = renderLayout('Genres', 'Manage catalog categories.');
            initLayout();
            if (!window.__adminEscapeBound) {
                window.__adminEscapeBound = true;
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        document.querySelectorAll('.modal.active').forEach((modal) => modal.classList.remove('active'));
                    }
                });
            }
            loadGenres();
        }

        let editingGenreId = null;

        async function loadGenres() {
            const content = document.getElementById('pageContent');
            content.innerHTML = '<div class="loading">Loading...</div>';

            try {
                const genres = await api.get('/api/genres');
                const genreList = Array.isArray(genres) ? genres : [];

                let html = `
                    <div class="card">
                        <div class="card-header">
                            <h2>Genres (${genreList.length})</h2>
                            <button class="btn btn-primary" data-action="showGenreForm">Add Genre</button>
                        </div>

                        <div id="genreModal" class="modal">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h3 id="genreFormTitle">Add New Genre</h3>
                                    <button class="modal-close" data-action="hideGenreForm" aria-label="Close">&times;</button>
                                </div>
                                <div class="modal-body">
                                    <form id="genreForm">
                                        <input type="hidden" id="genreId">
                                        <div class="form-group">
                                            <label>Name <span style="color: var(--danger);">*</span></label>
                                            <input type="text" id="genreName" required>
                                        </div>
                                        <div class="form-group">
                                            <label>Description</label>
                                            <textarea id="genreDescription" rows="3"></textarea>
                                        </div>
                                        <div id="genreFormError" class="alert alert-error" style="display: none;"></div>
                                        <div style="display: flex; gap: 0.5rem;">
                                            <button type="submit" class="btn btn-primary">Save Genre</button>
                                            <button type="button" class="btn btn-secondary" data-action="hideGenreForm">Cancel</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                if (genreList.length === 0) {
                    html += '<tr><td colspan="3" class="empty-state">No genres found</td></tr>';
                } else {
                    for (const genre of genreList) {
                        const id = genre.id || genre.Id;
                        html += `
                            <tr>
                                <td>${escapeHtml(genre.name || genre.Name || '')}</td>
                                <td>${escapeHtml(genre.description || genre.Description || '')}</td>
                                <td>
                                    <button class="btn btn-sm btn-secondary" data-action="editGenre" data-id="${id}">Edit</button>
                                    <button class="btn btn-sm btn-danger" data-action="deleteGenre" data-id="${id}" data-title="${escapeHtml(genre.name || genre.Name || '')}">Delete</button>
                                </td>
                            </tr>
                        `;
                    }
                }

                html += `
                            </tbody>
                        </table>
                        </div>
                    </div>
                `;

                content.innerHTML = html;
                attachGenreListeners(content);
            } catch (error) {
                content.innerHTML = `<div class="alert alert-error">Error: ${error.message}</div>`;
            }
        }

        function attachGenreListeners(content) {
            // Genre form
            content.querySelectorAll('[data-action="showGenreForm"]').forEach(b => {
                b.addEventListener('click', showGenreForm);
            });
            content.querySelectorAll('[data-action="hideGenreForm"]').forEach(b => {
                b.addEventListener('click', hideGenreForm);
            });
            const form = content.querySelector('#genreForm');
            if (form) {
                form.addEventListener('submit', saveGenre);
            }
            const modal = content.querySelector('#genreModal');
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) hideGenreForm();
                });
            }
            // Genre actions
            content.querySelectorAll('[data-action="editGenre"]').forEach(b => {
                b.addEventListener('click', () => editGenre(b.dataset.id));
            });
            content.querySelectorAll('[data-action="deleteGenre"]').forEach(b => {
                b.addEventListener('click', () => deleteGenre(b.dataset.id, b.dataset.title));
            });
        }

        function showGenreForm() {
            editingGenreId = null;
            document.getElementById('genreId').value = '';
            document.getElementById('genreFormTitle').textContent = 'Add New Genre';
            document.getElementById('genreForm').reset();
            const err = document.getElementById('genreFormError');
            if (err) { err.style.display = 'none'; err.textContent = ''; }
            const modal = document.getElementById('genreModal');
            if (modal) modal.classList.add('active');
        }

        function hideGenreForm() {
            const modal = document.getElementById('genreModal');
            if (modal) modal.classList.remove('active');
        }

        async function saveGenre(e) {
            e.preventDefault();
            const genreData = {
                name: document.getElementById('genreName').value,
                description: document.getElementById('genreDescription').value || null
            };
            const err = document.getElementById('genreFormError');
            if (err) { err.style.display = 'none'; err.textContent = ''; }

            try {
                if (editingGenreId) {
                    await api.put(`/api/admin/genres/${editingGenreId}`, genreData);
                } else {
                    await api.post('/api/admin/genres', genreData);
                }
                hideGenreForm();
                loadGenres();
            } catch (error) {
                if (err) {
                    err.textContent = error.message || 'Error saving genre';
                    err.style.display = 'block';
                } else {
                    alert('Error saving genre: ' + error.message);
                }
            }
        }

        async function editGenre(id) {
            // GET /api/genres returns all genres; find the one we want
            try {
                const genres = await api.get('/api/genres');
                const genreList = Array.isArray(genres) ? genres : [];
                const genre = genreList.find(g => (g.id || g.Id) === id);
                if (!genre) throw new Error('Genre not found');

                editingGenreId = id;
                document.getElementById('genreFormTitle').textContent = 'Edit Genre';
                document.getElementById('genreId').value = id;
                document.getElementById('genreName').value = genre.name || genre.Name || '';
                document.getElementById('genreDescription').value = genre.description || genre.Description || '';
                const err = document.getElementById('genreFormError');
                if (err) { err.style.display = 'none'; err.textContent = ''; }
                const modal = document.getElementById('genreModal');
                if (modal) modal.classList.add('active');
            } catch (error) {
                alert('Error loading genre: ' + error.message);
            }
        }

        async function deleteGenre(id, name) {
            if (!confirm(`Are you sure you want to delete genre "${name}"?`)) return;
            try {
                await api.delete(`/api/admin/genres/${id}`);
                loadGenres();
            } catch (error) {
                alert('Error deleting genre: ' + error.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
