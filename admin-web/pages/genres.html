<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genres - Book Community Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { auth } from '../js/auth.js';
        import { api } from '../js/api.js';
        import { renderLayout, initLayout } from '../js/layout.js';
        
        if (!auth.requireAdmin()) {
        } else {
            document.getElementById('app').innerHTML = renderLayout('Genres Management');
            initLayout();
            loadGenres();
        }
        
        async function loadGenres() {
            const content = document.getElementById('pageContent');
            content.innerHTML = '<div class="loading">Loading...</div>';
            
            try {
                const genres = await api.get('/api/genres');
                const genreList = Array.isArray(genres) ? genres : [];
                
                let html = `
                    <div class="card">
                        <div class="card-header">
                            <h2>Genres (${genreList.length})</h2>
                            <button class="btn btn-primary" onclick="alert('Create via POST /api/admin/genres')">Add Genre</button>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                if (genreList.length === 0) {
                    html += '<tr><td colspan="3" class="empty-state">No genres found</td></tr>';
                } else {
                    for (const genre of genreList) {
                        html += `
                            <tr>
                                <td>${escapeHtml(genre.name || genre.Name)}</td>
                                <td>${escapeHtml(genre.description || genre.Description || '')}</td>
                                <td>
                                    <button class="btn btn-sm btn-secondary" onclick="alert('Edit via PUT /api/admin/genres/{id}')">Edit</button>
                                    <button class="btn btn-sm btn-danger" onclick="alert('Delete via DELETE /api/admin/genres/{id}')">Delete</button>
                                </td>
                            </tr>
                        `;
                    }
                }
                
                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                
                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `<div class="alert alert-error">Error: ${error.message}</div>`;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
