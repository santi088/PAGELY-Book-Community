<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Book Community Admin</title>
    <link rel="stylesheet" href="../css/styles.css?v=20261126a">
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { auth } from '../js/auth.js';
        import { api } from '../js/api.js';
        import { renderLayout, initLayout } from '../js/layout.js';
        import { renderToolbar, renderPagination } from '../js/components.js';
        import { createListStore, bindListToolbar } from '../js/list-utils.js';

        // Filter/sort state persisted across modal opens (shared store)
        let store = null;

        const ok = await auth.requireAdmin();
        if (!ok) {
        } else {
            document.getElementById('app').innerHTML = renderLayout('Reports & Moderation', 'Review and resolve user reports.');
            initLayout();

            store = createListStore({
                search: '',
                filters: { reason: '' },
                sort: 'recent',
                page: 1,
                pageSize: 20
            });

            store.subscribe(() => {
                loadReports();
            });

            loadReports();
        }

        async function loadReports() {
            const content = document.getElementById('pageContent');
            content.innerHTML = '<div class="loading">Loading...</div>';

            try {
                const params = store.toParams();

                const result = await api.get(`/api/admin/reports?${params.toString()}`);
                const reportList = Array.isArray(result.items) ? result.items : (Array.isArray(result) ? result : []);
                const totalCount = result.totalCount ?? reportList.length;
                const totalPages = result.totalPages ?? 1;
                const page = result.page ?? 1;

                const s = store.get();

                let html = `
                    <div class="card">
                        <div class="card-header">
                            <h2>Reports (${totalCount})</h2>
                        </div>
                        ${renderToolbar({ 
                            searchPlaceholder: 'Search reports...', 
                            searchValue: s.search,
                            filters: [{ 
                                key: 'reason', 
                                options: [
                                    { value: '', label: 'All reasons' },
                                    { value: 'Misinformation', label: 'Misinformation' },
                                    { value: 'Inappropriate Content', label: 'Inappropriate Content' },
                                    { value: 'Spam', label: 'Spam' }
                                ],
                                value: s.filters.reason || ''
                            }], 
                            sortOptions: [
                                { value: 'recent', label: 'Most recent' },
                                { value: 'oldest', label: 'Oldest' },
                                { value: 'reason', label: 'Reason A-Z' },
                                { value: 'reviewer', label: 'Reviewer A-Z' },
                                { value: 'book', label: 'Book title A-Z' }
                            ],
                            sortValue: s.sort
                        })}
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Reason</th>
                                        <th>Book</th>
                                        <th>Review</th>
                                        <th>Status</th>
                                        <th>Reporter</th>
                                        <th>Created</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                if (reportList.length === 0) {
                    html += '<tr><td colspan="7" class="empty-state">No reports found</td></tr>';
                } else {
                    for (const report of reportList) {
                        const id = report.id || report.Id;
                        const rawStatus = report.status ?? report.Status;
                        const status = rawStatus === 0 || rawStatus === 'Pending' ? 0 :
                            rawStatus === 1 || rawStatus === 'Dismissed' ? 1 : 2;
                        const statusLabel = status === 0 ? 'Pending' : status === 1 ? 'Dismissed' : 'Resolved';
                        const statusClass = status === 0 ? 'pending' : status === 1 ? 'dismissed' : 'resolved';
                        const reviewText = report.reviewText || report.ReviewText || '';
                        html += `
                            <tr>
                                <td>${escapeHtml(report.reason || report.Reason)}</td>
                                <td>${escapeHtml(report.bookTitle || report.BookTitle || 'Book unavailable')}</td>
                                <td>${escapeHtml(reviewText.length > 80 ? reviewText.substring(0, 80) + '...' : reviewText)}</td>
                                <td><span class="status-${statusClass}">${statusLabel}</span></td>
                                <td>${escapeHtml(report.reporterEmail || report.ReporterEmail)}</td>
                                <td>${new Date(report.createdAt || report.CreatedAt).toLocaleDateString()}</td>
                                <td>
                                    <button class="btn btn-sm btn-secondary" data-action="viewReport" data-id="${id}">View</button>
                                    ${status === 0 ? `
                                        <button class="btn btn-sm btn-primary" data-action="dismissReport" data-id="${id}">Dismiss</button>
                                        <button class="btn btn-sm btn-success" data-action="resolveReport" data-id="${id}">Resolve</button>
                                        <button class="btn btn-sm btn-danger" data-action="removeReview" data-id="${id}" data-review-id="${report.reviewId || report.ReviewId}">Remove Review</button>
                                    ` : `<span style="color: var(--text-light);">${statusLabel}</span>`}
                                </td>
                            </tr>
                        `;
                    }
                }

                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                    ${renderPagination(page, s.pageSize, totalCount)}

                    <div id="reportModal" class="modal">
                        <div class="modal-content modal-sm">
                            <div class="modal-header">
                                <h3>Report Details</h3>
                                <button class="modal-close" data-action="closeReportModal" aria-label="Close">&times;</button>
                            </div>
                            <div class="modal-body" id="reportModalBody"></div>
                        </div>
                    </div>
                `;

                content.innerHTML = html;

                // Wire toolbar events via shared module (debounce 300ms, state persists)
                bindListToolbar('#pageContent', store, {
                    onSearch: (v) => store.setSearch(v),
                    onFilter: (key, v) => store.setFilter(key, v),
                    onSort: (v) => store.setSort(v),
                    onReset: () => store.reset(),
                    onPrev: () => store.setPage(store.get().page - 1),
                    onNext: () => store.setPage(store.get().page + 1)
                });

                // Action buttons
                const reportMap = new Map(reportList.map(r => [String(r.id || r.Id), r]));
                content.querySelectorAll('[data-action="viewReport"]').forEach(b => {
                    b.addEventListener('click', () => viewReport(reportMap.get(String(b.dataset.id))));
                });
                content.querySelectorAll('[data-action="dismissReport"]').forEach(b => {
                    b.addEventListener('click', () => moderateReport(b.dataset.id, 'Dismissed'));
                });
                content.querySelectorAll('[data-action="resolveReport"]').forEach(b => {
                    b.addEventListener('click', () => moderateReport(b.dataset.id, 'Resolved'));
                });
                content.querySelectorAll('[data-action="removeReview"]').forEach(b => {
                    b.addEventListener('click', () => removeReview(b.dataset.id, b.dataset.reviewId));
                });
                content.querySelectorAll('[data-action="closeReportModal"]').forEach(b => {
                    b.addEventListener('click', closeReportModal);
                });
                const modal = content.querySelector('#reportModal');
                if (modal) {
                    modal.addEventListener('click', (e) => {
                        if (e.target === modal) closeReportModal();
                    });
                }
            } catch (error) {
                content.innerHTML = `<div class="alert alert-error">Error: ${escapeHtml(error.message)}</div>`;
            }
        }

        async function moderateReport(id, action) {
            const notes = prompt(`Enter moderation notes for ${action}:`);
            if (notes === null) return;
            const hideReview = action === 'Resolved' && confirm('Hide the reported review?');
            try {
                await api.put(`/api/admin/reports/${id}/moderate`, {
                    status: action === 'Dismissed' ? 'Dismissed' : 'Resolved',
                    moderationNotes: notes || '',
                    hideReview: hideReview
                });
                loadReports();
            } catch (error) {
                alert('Error moderating report: ' + error.message);
            }
        }

        async function removeReview(reportId, reviewId) {
            if (!confirm('Remove this review from the catalog?')) return;
            try {
                await api.delete(`/api/admin/reviews/${reviewId}`);
                await api.put(`/api/admin/reports/${reportId}/moderate`, {
                    status: 'Resolved',
                    moderationNotes: 'Review removed by admin',
                    hideReview: true
                });
                loadReports();
            } catch (error) {
                alert('Error removing review: ' + error.message);
            }
        }

        function viewReport(report) {
            const modal = document.getElementById('reportModal');
            const body = document.getElementById('reportModalBody');
            if (!modal || !body || !report) return;
            const reviewText = report.reviewText || report.ReviewText || '';
            const bookTitle = report.bookTitle || report.BookTitle || 'Book unavailable';
            body.innerHTML = `
                <p><strong>Reason:</strong> ${escapeHtml(report.reason || report.Reason)}</p>
                <p><strong>Book:</strong> ${escapeHtml(bookTitle)}</p>
                <p><strong>Reporter:</strong> ${escapeHtml(report.reporterEmail || report.ReporterEmail)}</p>
                <p><strong>Created:</strong> ${new Date(report.createdAt || report.CreatedAt).toLocaleString()}</p>
                <p><strong>Review rating:</strong> ${report.reviewRating ?? report.ReviewRating ?? ''}/5</p>
                <p><strong>Full review:</strong></p>
                <p>${escapeHtml(reviewText)}</p>
                <p><strong>Details:</strong> ${escapeHtml(report.details || report.Details || 'None')}</p>
            `;
            modal.classList.add('active');
        }

        function closeReportModal() {
            const modal = document.getElementById('reportModal');
            if (modal) modal.classList.remove('active');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
    <style>
        .status-pending { color: #ea580c; font-weight: 600; }
        .status-dismissed { color: #6b7280; }
        .status-resolved { color: #16a34a; font-weight: 600; }
    </style>
</body>
</html>
